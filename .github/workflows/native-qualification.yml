name: native package qualification

on:
  workflow_call:
    inputs:
      revision: {required: true, type: string}
      matrix: {required: true, type: string}

permissions: {contents: read}
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native-gate-inputs:
    runs-on: ubuntu-24.04
    outputs:
      floor_image: ${{ steps.native.outputs.floor_image }}
    timeout-minutes: 180
    permissions: {contents: read}
    env:
      PM_JOB: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-linux-x86_64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
          restore-keys: release-tools-linux-x86_64-
      - name: Prepare Linux gate native inputs
        if: always()
        id: native
        env:
          RELEASE_TARGET: linux-x86_64
        run: |
          scripts/release-workflow prepare "$RELEASE_TARGET"
          . scripts/native-tools-env
          THINKTHEN_FLOOR_IMAGE=$(docker image inspect thinkthen-floor-build:glibc2.28 --format '{{.Id}}')
          export THINKTHEN_FLOOR_IMAGE
          native=$(scripts/native-prepare)
          echo "floor_image=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "THINKTHEN_FLOOR_IMAGE=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_ENV"
          mkdir gate-assets
          scripts/native-pair export gate-assets/pair.json
          python3 - "$native" <<'PYTHON'
          import json
          from pathlib import Path
          import shutil
          import sys
          source = Path(sys.argv[1])
          for name in json.loads(Path('gate-assets/pair.json').read_text())['assets']:
              destination = Path('gate-assets/assets') / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / name, destination)
          PYTHON
      - name: Prepare PostgreSQL inputs
        id: prepare-postgresql-inputs
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/postgres-prepare
      - name: Prepare Linux native test assets
        id: prepare-linux-native-test-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-test-assets prepare
      - name: Run the Linux-only SDK gate
        id: run-the-linux-only-sdk-gate
        if: always()
        run: |
          . scripts/native-tools-env
          status=0
          test_environment=$(scripts/native-test-assets env) || status=$?
          eval "$test_environment"
          scripts/postgres-gate || status=$?
          exit "$status"
      # Workflow artifacts transport gate inputs; they are never release assets.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-gate-linux-x86-64
        with:
          name: gate-linux-x86_64
          path: gate-assets/
          if-no-files-found: error
          retention-days: 1

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  gate:
    needs: native-gate-inputs
    if: always()
    runs-on: macos-15
    timeout-minutes: 180
    permissions: {contents: read}
    env:
      PM_JOB: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-macos-arm64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
      - name: Prepare host tools
        id: prepare-host-tools
        if: always()
        run: scripts/release-workflow prepare macos-arm64
      - name: Prepare offline gate dependencies
        id: prepare-offline-gate-dependencies
        if: always()
        run: scripts/qualification-gate-prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-gate-linux-x86-64
        if: always()
        with:
          name: gate-linux-x86_64
          path: ${{ runner.temp }}/gate-assets
      - name: Import the Linux native pair
        id: import-the-linux-native-pair
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-pair import "$RUNNER_TEMP/gate-assets/pair.json" "$RUNNER_TEMP/gate-assets/assets"
          THINKTHEN_FLOOR_IMAGE=$(scripts/native-pair image)
          echo "THINKTHEN_FLOOR_IMAGE=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare the host native pair
        id: prepare-the-host-native-pair
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-prepare >/dev/null
      - name: Prepare native test assets
        id: prepare-native-test-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-test-assets prepare
      - name: Prepare native ABI assets
        id: prepare-native-abi-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-abi-assets prepare
      - name: Run the full declared gate
        id: run-the-full-declared-gate
        if: always()
        run: |
          . scripts/native-tools-env
          status=0
          . scripts/native-env || status=$?
          scripts/gate || status=$?
          exit "$status"


      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  windows-r:
    needs: [native-gate-inputs, gate]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 90
    permissions: {contents: read}
    env:
      PM_JOB: release-${{ github.run_id }}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - name: Prepare pinned native Windows R inputs
        id: prepare-pinned-native-windows-r-inputs
        if: always()
        run: python3 scripts/release_windows_r.py prepare
      - name: Build the Windows R binary with native R
        id: build-the-windows-r-binary-with-native-r
        if: always()
        run: python3 scripts/release_windows_r.py build windows-r
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-native-windows-r
        with:
          name: native-windows-r
          path: windows-r/
          if-no-files-found: error
          retention-days: 1

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  build:
    needs: [native-gate-inputs, gate, windows-r]
    if: always()
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Initial cap; replace with measurements from the first approved run.
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
          restore-keys: release-tools-${{ matrix.target }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-native-windows-r
        if: always() && matrix.target == 'windows-x86_64'
        with:
          name: native-windows-r
          path: ${{ runner.temp }}/native-windows-r
      - name: Select the exact-source native Windows R package
        id: select-the-exact-source-native-windows-r-package
        if: always() && matrix.target == 'windows-x86_64'
        run: echo "THINKTHEN_WINDOWS_R_PACKAGE=$RUNNER_TEMP/native-windows-r" >> "$GITHUB_ENV"
      - name: Select the paired Linux compiler identity for Windows cross builds
        id: select-the-paired-linux-compiler-identity-for-windows-cross-builds
        if: always() && matrix.target == 'windows-x86_64'
        env:
          FLOOR_IMAGE: ${{ needs.native-gate-inputs.outputs.floor_image }}
        run: echo "THINKTHEN_FLOOR_IMAGE=$FLOOR_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare tools and dependencies
        id: prepare-tools-and-dependencies
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/release-workflow prepare "$RELEASE_TARGET"
      - name: Prepare runtime-only Linux qualification images
        id: prepare-runtime-only-linux-qualification-images
        if: always() && startsWith(matrix.target, 'linux-')
        env:
          PM_JOB: release-${{ github.run_id }}
        run: scripts/qualification-linux --prepare
      - name: Build and check installed packages against the stub
        id: build-and-check-installed-packages-against-the-stub
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: scripts/release-workflow build "$RELEASE_TARGET" release-files "$RELEASE_SHA"
      - name: Qualify packages on their native runtime floors
        id: qualify-packages-on-their-native-runtime-floors
        if: always() && matrix.target != 'windows-x86_64'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          . scripts/native-tools-env
          scripts/qualification-candidate "$RELEASE_TARGET" release-files/candidate "$RELEASE_SHA"
      # Candidate transport is permitted before Windows native qualification.
      # Bundle, draft and package publication require every native check below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-platform-matrix-target
        with:
          name: platform-${{ matrix.target }}
          path: release-files/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  windows-check:
    needs: build
    if: always()
    runs-on: windows-2022
    timeout-minutes: 60
    permissions: {contents: read}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - if: always()
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.24.13', cache: false}
      - if: always()
        id: setup-java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '22.0.2+9'}
      - if: always()
        id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: {dotnet-version: '10.0.103'}
      - name: Select the pinned Node runtime
        id: setup-node
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.12.0'}
      - name: Select the pinned Ruby runtime
        id: setup-ruby
        if: always()
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with: {ruby-version: '3.3.8'}
      - name: Prepare pinned Rust and offline header dependencies
        id: prepare-rust
        if: always()
        run: |
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from release_rust import prepare; prepare()'
          cargo fetch --locked --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-platform-windows-x86-64
        if: always()
        with:
          name: platform-windows-x86_64
          path: windows-candidate
      - name: Prepare the independent Windows C dependency
        id: prepare-the-independent-windows-c-dependency
        if: always()
        run: python3 scripts/qualification-windows-prepare
      - name: Prepare installed package runtimes
        id: prepare-installed-package-runtimes
        if: always()
        run: scripts/release-workflow prepare windows-x86_64
      - name: Prepare Kotlin README compiler dependencies
        id: prepare-kotlin-readme-compiler-dependencies
        if: always()
        run: mvn -B -q -f sdk/java/pom.xml "-Dmaven.repo.local=$HOME/.local/share/thinkthen-build-tools/jvm/m2" dependency:go-offline
      - name: Unpack the Windows candidate
        id: unpack-the-windows-candidate
        if: always()
        run: python3 -c 'import glob, tarfile; tarfile.open(glob.glob("windows-candidate/*.tar.gz")[0]).extractall("windows-installed", filter="data")'
      - name: Check every installed Windows SDK against the stub
        id: check-every-installed-windows-sdk-against-the-stub
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.revision }}
        run: python3 scripts/qualification-candidate windows-x86_64 windows-installed "$RELEASE_SHA"
      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary
