name: native package qualification

on:
  workflow_call:
    inputs:
      revision: {required: true, type: string}
      matrix: {required: true, type: string}

permissions: {contents: read}
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native-gate-inputs:
    runs-on: ubuntu-24.04
    outputs:
      floor_image: ${{ steps.floor.outputs.floor_image }}
    timeout-minutes: 180
    permissions: {contents: read}
    env:
      PM_JOB: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-linux-x86_64-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
          restore-keys: release-tools-linux-x86_64-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-
      - name: Publish the verified Linux floor image
        if: always()
        id: floor
        env:
          RELEASE_TARGET: linux-x86_64
        run: |
          scripts/release-workflow prepare "$RELEASE_TARGET"
          . scripts/native-tools-env
          THINKTHEN_FLOOR_IMAGE=$(python3 scripts/release_images.py floor)
          export THINKTHEN_FLOOR_IMAGE
          echo "floor_image=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "THINKTHEN_FLOOR_IMAGE=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare Linux gate native inputs
        if: always() && steps.floor.outcome == 'success'
        id: native
        run: |
          . scripts/native-tools-env
          native=$(scripts/native-prepare)
          test ! -L gate-assets
          mkdir -p gate-assets
          test -O gate-assets
          pair=$(mktemp)
          trap 'rm -f "$pair"' EXIT
          scripts/native-pair export "$pair"
          python3 - "$native" "$pair" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys
          source, pair = map(Path, sys.argv[1:])
          manifest = json.loads(pair.read_text())
          root = Path('gate-assets')
          files = {root / 'pair.json': pair,
                   **{root / 'assets' / name: source / name for name in manifest['assets']}}
          # Check every reserved path before touching caller-owned contents.
          for destination, origin in files.items():
              for parent in destination.parents:
                  if parent == Path('.'):
                      break
                  if parent.is_symlink() or (parent.exists() and
                          (not parent.is_dir() or parent.stat().st_uid != os.geteuid())):
                      sys.exit('unsafe native gate asset directory: ' + str(parent))
              if destination.is_symlink() or (destination.exists() and
                      (not destination.is_file() or destination.stat().st_uid != os.geteuid())):
                  sys.exit('unsafe native gate asset file: ' + str(destination))
              if destination.exists():
                  matches = (json.loads(destination.read_text()) == manifest if destination.name == 'pair.json'
                             else destination.read_bytes() == origin.read_bytes())
                  if not matches:
                      sys.exit('native gate asset conflicts with prepared pair: ' + str(destination))
          for name, checksum in manifest['assets'].items():
              if hashlib.sha256((source / name).read_bytes()).hexdigest() != checksum:
                  sys.exit('native gate asset hash differs: ' + name)
          for destination, origin in files.items():
              destination.parent.mkdir(parents=True, exist_ok=True)
              if not destination.exists():
                  shutil.copy2(origin, destination)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('asset_paths<<ASSET_PATHS\n' + '\n'.join(map(str, files)) + '\nASSET_PATHS\n')
          PYTHON
      - name: Prepare PostgreSQL inputs
        id: prepare-postgresql-inputs
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/postgres-prepare
      - name: Prepare Linux native test assets
        id: prepare-linux-native-test-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-test-assets prepare
      - name: Run the Linux-only SDK gate
        id: run-the-linux-only-sdk-gate
        if: always()
        run: |
          . scripts/native-tools-env
          status=0
          test_environment=$(scripts/native-test-assets env) || status=$?
          eval "$test_environment"
          scripts/postgres-gate || status=$?
          exit "$status"
      - name: Prove Linux system certificate store behavior
        id: linux-system-store
        if: always()
        run: |
          . scripts/native-tools-env
          python3 scripts/linux-store-trust-check
      - name: Run Linux command adapter cases inside the prepared floor
        id: linux-cli
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/runtime-floor-build python3 scripts/linux-binding-gate --cli
      # Workflow artifacts transport gate inputs; they are never release assets.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-gate-linux-x86-64
        with:
          name: gate-linux-x86_64
          path: ${{ steps.native.outputs.asset_paths }}
          if-no-files-found: error
          retention-days: 7

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  gate:
    needs: native-gate-inputs
    if: always()
    runs-on: macos-15
    timeout-minutes: 180
    permissions: {contents: read}
    env:
      PM_JOB: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-macos-arm64-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
      - name: Prepare host tools
        id: prepare-host-tools
        if: always()
        run: scripts/release-workflow prepare macos-arm64
      - name: Prepare offline gate dependencies
        id: prepare-offline-gate-dependencies
        if: always()
        run: scripts/qualification-gate-prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-gate-linux-x86-64
        if: always()
        with:
          name: gate-linux-x86_64
          path: ${{ runner.temp }}/gate-assets
      - name: Import the Linux native pair
        id: import-the-linux-native-pair
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-pair import "$RUNNER_TEMP/gate-assets/pair.json" "$RUNNER_TEMP/gate-assets/assets"
          THINKTHEN_FLOOR_IMAGE=$(scripts/native-pair image)
          echo "THINKTHEN_FLOOR_IMAGE=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare the host native pair
        id: prepare-the-host-native-pair
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-prepare >/dev/null
      - name: Prepare native test assets
        id: prepare-native-test-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-test-assets prepare
      - name: Prepare native ABI assets
        id: prepare-native-abi-assets
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/native-abi-assets prepare
      - name: Run the full declared gate
        id: run-the-full-declared-gate
        if: always()
        # The previous preparation took 22m22 of this job's 180m budget.
        # This leaves about seven minutes for diagnostics at that preparation time.
        # The gate has a 45m per-stage watchdog: local Mac gate 1014s, SDKs 615s, Rust tests 217s.
        timeout-minutes: 150
        env:
          THINKTHEN_GATE_DIAGNOSTICS: ${{ runner.temp }}/gate-diagnostics
        run: scripts/hosted-gate
      - name: Preserve gate stage times and running output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-diagnostics-macos-arm64
          path: ${{ runner.temp }}/gate-diagnostics/
          if-no-files-found: warn
          retention-days: 7


      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  windows-r:
    if: always()
    runs-on: windows-2022
    timeout-minutes: 90
    permissions: {contents: read}
    env:
      PYTHONUTF8: '1'
      PM_JOB: release-${{ github.run_id }}
    defaults: {run: {shell: bash}}
    steps:
      - name: Preserve source bytes on Windows
        id: configure-checkout
        if: always()
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - name: Prepare pinned native Windows R inputs
        id: prepare-pinned-native-windows-r-inputs
        if: always()
        run: python3 scripts/release_windows_r.py prepare
      - name: Build the Windows R binary with native R
        id: build-the-windows-r-binary-with-native-r
        if: always()
        run: python3 scripts/release_windows_r.py build windows-r
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-native-windows-r
        with:
          name: native-windows-r
          path: windows-r/
          if-no-files-found: error
          retention-days: 7

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  build:
    if: always()
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Initial cap; replace with measurements from the first approved run.
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-${{ matrix.target }}-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
          restore-keys: release-tools-${{ matrix.target }}-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-
      - name: Prepare tools and dependencies
        id: prepare-tools-and-dependencies
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/release-workflow prepare "$RELEASE_TARGET"
      - name: Prepare runtime-only Linux qualification images
        id: prepare-runtime-only-linux-qualification-images
        if: always() && startsWith(matrix.target, 'linux-')
        env:
          PM_JOB: release-${{ github.run_id }}
        run: scripts/qualification-linux --prepare
      - name: Build and check installed packages against the stub
        id: build-and-check-installed-packages-against-the-stub
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: scripts/release-workflow build "$RELEASE_TARGET" release-files "$RELEASE_SHA"
      - name: Qualify packages on their native runtime floors
        id: qualify-packages-on-their-native-runtime-floors
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          . scripts/native-tools-env
          scripts/qualification-candidate "$RELEASE_TARGET" release-files/candidate "$RELEASE_SHA"
      - name: Install the real candidate through the public install script
        id: installer
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: python3 scripts/release-installer-check "$RELEASE_TARGET" release-files/candidate "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-platform-matrix-target
        with:
          name: platform-${{ matrix.target }}
          path: release-files/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  build-windows:
    needs: [native-gate-inputs, windows-r]
    if: always()
    strategy:
      fail-fast: false
      matrix: {include: [{target: windows-x86_64, runner: ubuntu-24.04}]}
    runs-on: ${{ matrix.runner }}
    # Initial cap; replace with measurements from the first approved run.
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
            ~/.local/share/uv
            ~/.local/share/thinkthen-build-tools
          key: release-tools-${{ matrix.target }}-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION') }}
          restore-keys: release-tools-${{ matrix.target }}-pins-${{ hashFiles('scripts/release-downloads.json', 'scripts/release-tools.json', 'scripts/release-windows-prepare') }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-native-windows-r
        if: always() && matrix.target == 'windows-x86_64'
        with:
          name: native-windows-r
          path: ${{ runner.temp }}/native-windows-r
      - name: Select the exact-source native Windows R package
        id: select-the-exact-source-native-windows-r-package
        if: always() && matrix.target == 'windows-x86_64'
        run: echo "THINKTHEN_WINDOWS_R_PACKAGE=$RUNNER_TEMP/native-windows-r" >> "$GITHUB_ENV"
      - name: Select the paired Linux compiler identity for Windows cross builds
        id: select-the-paired-linux-compiler-identity-for-windows-cross-builds
        if: always() && matrix.target == 'windows-x86_64'
        env:
          FLOOR_IMAGE: ${{ needs.native-gate-inputs.outputs.floor_image }}
        run: echo "THINKTHEN_FLOOR_IMAGE=$FLOOR_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare tools and dependencies
        id: prepare-tools-and-dependencies
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/release-workflow prepare "$RELEASE_TARGET"
      - name: Prepare runtime-only Linux qualification images
        id: prepare-runtime-only-linux-qualification-images
        if: always() && startsWith(matrix.target, 'linux-')
        env:
          PM_JOB: release-${{ github.run_id }}
        run: scripts/qualification-linux --prepare
      - name: Build and check installed packages against the stub
        id: build-and-check-installed-packages-against-the-stub
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: scripts/release-workflow build "$RELEASE_TARGET" release-files "$RELEASE_SHA"
      - name: Qualify packages on their native runtime floors
        id: qualify-packages-on-their-native-runtime-floors
        if: always() && matrix.target != 'windows-x86_64'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          . scripts/native-tools-env
          scripts/qualification-candidate "$RELEASE_TARGET" release-files/candidate "$RELEASE_SHA"
      # Candidate transport is permitted before Windows native qualification.
      # Bundle, draft and package publication require every native check below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact-platform-matrix-target
        if: always()
        with:
          name: platform-${{ matrix.target }}
          path: release-files/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  windows-check:
    needs: build-windows
    if: always()
    runs-on: windows-2022
    timeout-minutes: 120
    permissions: {contents: read}
    env:
      PYTHONUTF8: '1'
    defaults: {run: {shell: bash}}
    steps:
      - name: Preserve source bytes on Windows
        id: configure-checkout
        if: always()
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        if: always()
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - if: always()
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.24.13', cache: false}
      - if: always()
        id: setup-java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '22.0.2+9'}
      - if: always()
        id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: {dotnet-version: '10.0.103'}
      - name: Select the pinned Node runtime
        id: setup-node
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.12.0'}
      - name: Select the pinned Ruby runtime
        id: setup-ruby
        if: always()
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with: {ruby-version: '3.3.8'}
      - name: Prepare pinned Rust and offline header dependencies
        id: prepare-rust
        if: always()
        run: |
          python3 -c 'import hashlib,os; from pathlib import Path; target=Path.home()/".local/share/thinkthen-build-tools/windows-native"/hashlib.sha256(os.fsencode(Path.cwd())).hexdigest(); open(os.environ["GITHUB_ENV"],"a",encoding="utf-8").write("CARGO_TARGET_DIR="+str(target)+"\n")'
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from release_rust import prepare; prepare()'
          cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Build the pinned native Windows loopback once
        id: windows-loopback
        if: always()
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $env:RUSTUP_TOOLCHAIN = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          cargo build --offline --locked --target x86_64-pc-windows-msvc -p loopback --bin loopback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "THINKTHEN_LOOPBACK=$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/loopback.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-artifact-platform-windows-x86-64
        if: always()
        with:
          name: platform-windows-x86_64
          path: windows-candidate
      - name: Prepare the independent Windows C dependency
        id: prepare-the-independent-windows-c-dependency
        if: always()
        run: python3 scripts/qualification-windows-prepare
      - name: Prepare installed package runtimes
        id: prepare-installed-package-runtimes
        if: always()
        run: scripts/release-workflow prepare windows-x86_64
      - name: Prepare Kotlin README compiler dependencies
        id: prepare-kotlin-readme-compiler-dependencies
        if: always()
        run: python3 scripts/kotlin_compiler.py
      - name: Unpack the Windows candidate
        id: unpack-the-windows-candidate
        if: always()
        run: python3 -c 'import glob, tarfile; tarfile.open(glob.glob("windows-candidate/*.tar.gz")[0]).extractall("windows-installed", filter="data")'
      - name: Check every installed Windows SDK against the stub
        id: check-every-installed-windows-sdk-against-the-stub
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.revision }}
        run: python3 scripts/qualification-candidate windows-x86_64 windows-installed "$RELEASE_SHA"
      - name: Install the real Windows command through PowerShell
        id: installer
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.revision }}
        run: python3 scripts/release-installer-check windows-x86_64 windows-installed "$RELEASE_SHA"
      - name: Prove Windows transport trust
        id: transport-trust
        shell: pwsh
        if: always()
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $env:RUSTUP_TOOLCHAIN = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked --target x86_64-pc-windows-msvc -p thinkthen --no-default-features --features native --test transport_trust -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows command cancellation and file cleanup
        id: windows-cli
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.revision }}
        run: python3 scripts/release-installer-check windows-x86_64 windows-installed "$RELEASE_SHA" --cli
      - name: Preserve Windows CLI failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cli-diagnostics
          path: target/windows-cli-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Report every qualification failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary
