name: Installed Linux resource qualification
on:
  workflow_dispatch:
    inputs:
      source: {description: Full qualified product commit, required: true, type: string}
      producer_run: {description: Exact official producer run ID, required: true, type: string}
      producer_attempt: {description: Exact producer attempt, required: true, type: string}
      artifact: {description: Exact Linux platform artifact ID, required: true, type: string}
      zip_sha256: {description: Official artifact ZIP digest, required: true, type: string}
      archive_sha256: {description: Nested platform archive digest, required: true, type: string}
      tasks:
        description: JSON array of selected family-wire tasks; no implicit matrix
        required: true
        default: '["c-systemone","c-openai"]'
        type: string
      parallelism: {description: Maximum simultaneous standard public jobs, default: 4, required: true, type: number}
      preflight_only: {description: Wiring only; never qualifies a soak, default: false, type: boolean}
permissions: {contents: read, actions: read}
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
jobs:
  validate:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallelism }}
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    steps:
      - name: Check out the reviewed diagnostic carrier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {path: harness, persist-credentials: false}
      - name: Check out the explicitly identified product
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ inputs.source }}', path: source, persist-credentials: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.13'}
      - name: Fetch the named producer metadata and exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          ARTIFACT: ${{ inputs.artifact }}
          PARALLELISM: ${{ inputs.parallelism }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          run,attempt,artifact=(int(os.environ[key]) for key in ('PRODUCER_RUN','PRODUCER_ATTEMPT','ARTIFACT'))
          assert 1 <= int(os.environ['PARALLELISM']) <= 8
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/botassembly/thinkthen/'+path]))
          metadata={'requested':{'run':run,'attempt':attempt,'artifact':artifact},
                    'run':api(f'actions/runs/{run}/attempts/{attempt}'),
                    'artifact':api(f'actions/artifacts/{artifact}'),
                    'jobs':api(f'actions/runs/{run}/attempts/{attempt}/jobs?per_page=100')}
          (root/'provenance.json').write_text(json.dumps(metadata,indent=2)+'\n')
          with (root/'platform.zip').open('wb') as output:
              result=subprocess.run(['gh','api',f'repos/botassembly/thinkthen/actions/artifacts/{artifact}/zip'],stdout=output,stderr=subprocess.PIPE)
              if result.returncode:
                  raise SystemExit('Named artifact download failed; no adapter ran')
          PY
      - name: Prepare the product's pinned fixture compiler
        working-directory: source
        run: |
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from release_rust import prepare; prepare()'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Admit, stage, preflight and run one selected backend
        env:
          TASK: ${{ matrix.task }}
          PRODUCT_SHA: ${{ inputs.source }}
          ZIP_SHA: ${{ inputs.zip_sha256 }}
          ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
          PREFLIGHT: ${{ inputs.preflight_only }}
        run: |
          args=()
          if [ "$PREFLIGHT" = true ]; then args+=(--preflight-only); fi
          python3 harness/scripts/hosted-linux-validation "$TASK" \
            --source "$GITHUB_WORKSPACE/source" --product-sha "$PRODUCT_SHA" \
            --provenance "$RUNNER_TEMP/provenance.json" --archive "$RUNNER_TEMP/platform.zip" \
            --zip-sha256 "$ZIP_SHA" --archive-sha256 "$ARCHIVE_SHA" \
            --output "$RUNNER_TEMP/evidence" "${args[@]}"
      - name: Preserve identities, counts and raw resource checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-${{ matrix.task }}-${{ inputs.preflight_only && 'preflight' || 'full' }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.jsonl
            ${{ runner.temp }}/evidence/*.log
            ${{ runner.temp }}/evidence/*.txt
            ${{ runner.temp }}/evidence/*.maps
            ${{ runner.temp }}/evidence/preflight/
            ${{ runner.temp }}/provenance.json
          if-no-files-found: error
          retention-days: 7
