name: Retained perf analysis only (no target execution)
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {path: harness, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13727436356'
          run-id: '42736658748'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/capture
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13712172091'
          run-id: '42698274553'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform
          merge-multiple: true
      - name: Decode existing bytes only with signed pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/analysis"
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends linux-tools-7.0.0-1017-azure=7.0.0-1017.17~24.04.1
          dpkg-query -W linux-tools-7.0.0-1017-azure > "$RUNNER_TEMP/analysis/tool-package.txt"
          PERF=/usr/bin/perf
          test -f "$PERF"
          test -x "$PERF"
          test "$(/usr/bin/perf version)" = 'perf version 7.0.14'
          REAL_PERF=$(readlink -f "/usr/lib/linux-tools/$(uname -r)/perf")
          test -n "$REAL_PERF"
          test -f "$REAL_PERF"
          test -x "$REAL_PERF"
          OWNER=$(dpkg-query -S "$REAL_PERF" | awk -F ': ' '{print $1}')
          test -n "$OWNER"
          test "$(dpkg-query -W -f='${Version}' "$OWNER")" = '7.0.0-1017.17~24.04.1'
          dpkg-query -W -f='${Depends}\n' linux-tools-7.0.0-1017-azure > "$RUNNER_TEMP/analysis/tool-dependencies.txt"
          grep -F "$OWNER (= 7.0.0-1017.17~24.04.1)" "$RUNNER_TEMP/analysis/tool-dependencies.txt"
          dpkg-query -W "$OWNER" linux-tools-common > "$RUNNER_TEMP/analysis/decoder-packages.txt"
          printf '%s\n' "$PERF" "$REAL_PERF" > "$RUNNER_TEMP/analysis/decoder-paths.txt"
          python3 harness/scripts/diagnostics/csharp-perf-analysis "$RUNNER_TEMP/capture" "$RUNNER_TEMP/platform/thinkthen-0.2.0-linux-x86_64-packages.tar.gz" "$RUNNER_TEMP/analysis" "$PERF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-perf-analysis
          path: ${{ runner.temp }}/analysis/
          if-no-files-found: warn
          retention-days: 7
