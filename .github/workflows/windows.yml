# Windows 0.2 core: CLI/Rust, C DLL and Python, dispatched only after approval.
# No publishing or credentials. Product tests use fake keys and loopback.
# Download locked dependencies first; build and test offline afterward.

name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stage-0:
    name: Windows core tests and installed CLI, Rust, C and Python packages
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'

    steps:
      # The runner's Git turns LF into CRLF on checkout. The fixtures and
      # goldens are byte-exact, so check out the bytes the repository holds.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the toolchain that rust-toolchain.toml pins
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13', architecture: 'x64'}

      - name: Download the pinned Python build and test packages
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check 'maturin==1.15.0'
          python3 -m pip download --only-binary=:all: --require-hashes -r libraries/python/requirements-dev.txt -d "$RUNNER_TEMP/python-packages/pandas3"
          python3 -m pip download --only-binary=:all: --require-hashes -r libraries/python/requirements-pandas2.txt -d "$RUNNER_TEMP/python-packages/pandas2"

      # Restore and save are separate steps, so a failed run still saves its
      # build for the next run.
      - name: Restore the cargo registry and the build directories
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            libraries/c/target
          key: windows-${{ hashFiles('Cargo.lock', 'libraries/c/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-

      # The default folders resolve under APPDATA and LOCALAPPDATA on Windows.
      # Point both at the runner's temp folder, so no test writes the runner
      # user's real folders. A job-level env cannot read the runner context.
      - name: Point the default folders at the runner's temp folder
        run: |
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"

      - name: Select x64 MSVC
        run: python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"

      - name: Download the locked crates
        run: |
          set -eu
          cargo fetch --locked
          cargo fetch --locked --manifest-path libraries/c/Cargo.toml
          cargo fetch --locked --manifest-path libraries/python/Cargo.toml

      # Each check runs even after an earlier one fails, so one run shows
      # every result, and `--keep-going` checks every crate past a failing one.
      # The job still fails if any check fails.
      - name: Clippy, root workspace
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --offline --keep-going --workspace --all-targets -- -D warnings

      - name: Tests, root workspace
        if: ${{ !cancelled() }}
        run: cargo test --locked --offline --no-fail-fast --workspace --all-targets

      - name: Clippy, libraries/c
        if: ${{ !cancelled() }}
        working-directory: libraries/c
        run: cargo clippy --locked --offline --keep-going --all-targets -- -D warnings

      - name: Tests, libraries/c
        if: ${{ !cancelled() }}
        working-directory: libraries/c
        run: cargo test --locked --offline --no-fail-fast

      - name: Build and test the installed Windows Python wheel
        if: ${{ !cancelled() }}
        run: python3 libraries/python/check-windows.py --packages "$RUNNER_TEMP/python-packages"

      - name: Pack the Windows core and consume the native C archive
        if: ${{ !cancelled() }}
        run: |
          set -eu
          export CARGO_NET_OFFLINE=true
          sdlc/scripts/release-pack x86_64-pc-windows-msvc native-platform command c python first-run
          sdlc/scripts/release-pack x86_64-pc-windows-msvc native-crate crate
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          python3 sdlc/scripts/release-windows-command.py platform native-platform "$version"
          python3 sdlc/scripts/release-windows-c-smoke.py "native-platform/thinkthen-c-$version-x86_64-pc-windows-msvc.zip"
          python3 sdlc/scripts/release-windows-smoke.py native-platform --crate-dir native-crate

      - name: Save the cargo registry and the build directories
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            libraries/c/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
