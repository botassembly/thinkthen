name: Retained Windows harness diagnosis
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults: {run: {shell: pwsh}}
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out the reviewed diagnostic carrier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {path: harness, persist-credentials: false}
      - name: Check out the retained product source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 2e8ccec301ee9f6a423c46157947f391e1e960d7
          path: source
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.13'}
      - name: Fetch only the named official producer evidence and artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          @'
          import json,os,pathlib,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'windows-retained'
          output.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/botassembly/thinkthen/'+path]))
          metadata={'run':api('actions/runs/42866225471/attempts/1'),
                    'artifact':api('actions/artifacts/13792868034'),
                    'jobs':api('actions/runs/42866225471/attempts/1/jobs?per_page=100')}
          (output/'provenance.json').write_text(json.dumps(metadata,indent=2)+'\n')
          with (output/'platform.zip').open('wb') as stream:
              result=subprocess.run(['gh','api','repos/botassembly/thinkthen/actions/artifacts/13792868034/zip'],stdout=stream,stderr=subprocess.PIPE)
              if result.returncode:
                  raise SystemExit('Retained artifact download failed; no proof ran')
          '@ | python -
      - name: Run only installed store controls, recovery and C cleanup
        run: >-
          python harness/scripts/retained-windows-validation
          --source source --harness harness
          --provenance "$env:RUNNER_TEMP/windows-retained/provenance.json"
          --artifact "$env:RUNNER_TEMP/windows-retained/platform.zip"
          --output "$env:RUNNER_TEMP/windows-retained/evidence"
      - name: Preserve independent case results and failure witnesses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-windows-harness-diagnosis
          path: |
            ${{ runner.temp }}/windows-retained/provenance.json
            ${{ runner.temp }}/windows-retained/evidence/identity.json
            ${{ runner.temp }}/windows-retained/evidence/*.log
            ${{ runner.temp }}/windows-retained/evidence/response-*/
            ${{ runner.temp }}/windows-retained/evidence/recovery/
          if-no-files-found: error
          retention-days: 7
