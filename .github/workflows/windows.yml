name: Linux release validation (diagnostic branch)

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run eight rounds of 100 records to check wiring; never release evidence
        type: boolean
        default: false

permissions: {contents: read, actions: read}
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  validate:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [packing, c-systemone, c-openai]
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - name: Check out the identified harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: harness
          persist-credentials: false
      - name: Check out the frozen product source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 4874fbb0768fb16389508cd0019a4e8a091c888a
          path: source
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/thinkthen-build-tools
            target
          key: release-validation-linux-x86_64-${{ matrix.task }}-${{ hashFiles('source/rust-toolchain.toml', 'source/Cargo.lock', 'source/Cargo.toml', 'source/crates/**', 'source/sdk/**', 'source/scripts/release-downloads.json', 'source/scripts/release-tools.json', 'source/scripts/release_rust.py') }}
      - name: Prepare only the pinned Rust toolchain
        working-directory: source
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from release_rust import prepare; prepare()'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Download the actual final Linux platform archive
        if: matrix.task != 'packing'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '13712172091'
          run-id: '42698274553'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform
          merge-multiple: true
      - name: Run focused source checks or one complete C backend soak
        env:
          VALIDATION_TASK: ${{ matrix.task }}
          VALIDATION_SMOKE: ${{ inputs.smoke }}
        run: |
          status=0
          python3 harness/scripts/hosted-linux-validation "$VALIDATION_TASK" \
            --source "$GITHUB_WORKSPACE/source" \
            --archive "$RUNNER_TEMP/platform/thinkthen-0.2.0-linux-x86_64-packages.tar.gz" \
            --output "$RUNNER_TEMP/evidence" \
            --size "$VALIDATION_SMOKE" || status=$?
          mkdir -p "$RUNNER_TEMP/evidence"
          printf '%s\n' "$status" > "$RUNNER_TEMP/evidence/validation-exit-code.txt"
          exit "$status"
      - name: Preserve logs, identities and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-validation-${{ matrix.task }}-${{ inputs.smoke && 'smoke' || 'full' }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 7
