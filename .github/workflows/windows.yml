name: Native Ubuntu perf bootstrap (diagnostic only)
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {path: harness, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4874fbb0768fb16389508cd0019a4e8a091c888a
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13712172091'
          run-id: '42698274553'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform
          merge-multiple: true
      - name: Admit only standard native kernel tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if ! /usr/bin/perf version; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)"
          fi
          /usr/bin/perf version --build-options > "$RUNNER_TEMP/evidence/perf-version.txt"
          if ! mountpoint -q /sys/kernel/tracing; then sudo -n mount -t tracefs tracefs /sys/kernel/tracing; fi
          uname -a > "$RUNNER_TEMP/evidence/kernel.txt"
          getconf GNU_LIBC_VERSION > "$RUNNER_TEMP/evidence/glibc.txt"
          dpkg-query -W 'linux-tools*' > "$RUNNER_TEMP/evidence/tool-packages.txt"
      - name: Bootstrap only, never a data control
        run: >-
          python3 harness/scripts/diagnostics/csharp-perf-bootstrap
          --source "$GITHUB_WORKSPACE/source"
          --archive "$RUNNER_TEMP/platform/thinkthen-0.2.0-linux-x86_64-packages.tar.gz"
          --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ubuntu-perf-bootstrap
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 7
