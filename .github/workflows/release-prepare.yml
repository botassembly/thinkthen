name: Diagnostic stage sweep
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PM_JOB: diagnostic-${{ github.run_id }}
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  macos-gate:
    needs: macos-input
    if: always()
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - stage: host-tools
          command: for tool in python3 git cargo rustc cc c++ make cmake pkg-config uv node npm ruby R Rscript staticcheck; do command -v "$tool" || exit 1; done;
            python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3,11) else 1)'; R --version; Rscript --version
        - stage: metadata
          command: python3 scripts/release_metadata.py
        - stage: release-script-test
          command: scripts/release-script-test
        - stage: release-preparation-test
          command: scripts/release-preparation-test
        - stage: release-staging-test
          command: scripts/release-staging-test
        - stage: release-publish-test
          command: scripts/release-publish-test
        - stage: release-floor-inputs-test
          command: scripts/release-floor-inputs-test
        - stage: words
          command: scripts/words
        - stage: secrets
          command: scripts/secrets
        - stage: bindings-schema
          command: scripts/bindings-schema
        - stage: contract-schema-check
          command: scripts/contract-schema-check
        - stage: notices
          command: scripts/notices --check
        - stage: supply-chain-check
          command: scripts/supply-chain-check
        - stage: rust-advisories
          command: scripts/rust-advisories
        - stage: fmt
          command: cargo fmt --all --check
        - stage: core-check
          command: scripts/core-check
        - stage: fixture-routing-check
          command: scripts/fixture-routing-check
        - stage: clippy
          command: cargo clippy --workspace --all-targets --features thinkthen/stream --locked -- -D warnings
        - stage: c-gate
          command: scripts/c-gate
        - stage: rust-tests
          command: cargo test --workspace --features thinkthen/stream --locked
        - stage: crate-package-test
          command: scripts/crate-package-test
        - stage: bash-example
          command: guide_root=$PWD; guide_scratch=$(mktemp -d); python3 scripts/surface-example prepare bash "$guide_scratch" || exit; command_target=${CARGO_TARGET_DIR:-$PWD/target};
            case "$command_target" in /*) ;; *) command_target="$PWD/$command_target" ;; esac; cd "$guide_scratch"; PATH="$command_target/debug:$PATH" python3 "$guide_root/scripts/surface-example"
            check bash bash example.sh
        - stage: python-gate
          command: scripts/python-gate
        - stage: typescript-gate
          command: scripts/typescript-gate
        - stage: r-gate
          command: scripts/r-gate
        - stage: c-sdk-gate
          command: scripts/c-sdk-gate
        - stage: cpp-sdk-gate
          command: scripts/cpp-sdk-gate
        - stage: ruby-gate
          command: scripts/ruby-gate
        - stage: zig-sdk-gate
          command: scripts/zig-sdk-gate
        - stage: swift-gate
          command: scripts/swift-gate
        - stage: go-gate
          command: scripts/go-gate
        - stage: jvm-gate
          command: scripts/jvm-gate
        - stage: csharp-gate
          command: scripts/csharp-gate
        - stage: duckdb-gate
          command: scripts/duckdb-gate
        - stage: sqlite-gate
          command: scripts/sqlite-gate
        - stage: postgres-gate
          command: scripts/postgres-gate
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: Verify exact product source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/uv
          ~/.local/share/uv
          ~/.local/share/thinkthen-build-tools
        key: release-tools-macos-arm64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**',
          'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION')
          }}
        restore-keys: release-tools-macos-arm64-
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: always()
      continue-on-error: true
      with:
        name: macos-prepared-input
        path: ${{ runner.temp }}/macos-input
    - name: Run independent stage with prepared inputs
      if: always()
      env:
        STAGE: ${{ matrix.stage }}
        COMMAND: ${{ matrix.command }}
      run: |
        mkdir -p diagnostic
        record() {
          label="$1"; shift
          set +e
          "$@" 2>&1 | tee "diagnostic/$label.log"
          code=${PIPESTATUS[0]}
          printf '%s\t%s\n' "$label" "$code" >> diagnostic/outcomes.tsv
          return 0
        }
        record restore-inputs tar -xf "$RUNNER_TEMP/macos-input/prepared.tar" -C "$HOME"
        set +e
        . scripts/native-tools-env
        record native-env bash -c '. scripts/native-env'
        if [ "$code" -eq 0 ]; then
          . scripts/native-env
        fi
        record "$STAGE" bash -c "$COMMAND"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-${{ matrix.stage }}
        path: diagnostic/
        if-no-files-found: warn
        retention-days: 7
    - name: Report every outcome
      if: always()
      shell: bash
      run: |
        cat diagnostic/outcomes.tsv
        awk -F '\t' '$2 != 0 { bad=1 } END { exit bad }' diagnostic/outcomes.tsv
  windows-proof:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stage:
        - transport-trust
        - go
        - jvm
        - csharp
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: Verify exact product source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.24.13
        cache: false
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: 22.0.2+9
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 10.0.103
    - name: Run native engine and independent consumer
      if: always()
      env:
        STAGE: ${{ matrix.stage }}
      run: |
        mkdir -p diagnostic
        record() {
          label="$1"; shift
          set +e
          "$@" 2>&1 | tee "diagnostic/$label.log"
          code=${PIPESTATUS[0]}
          printf '%s\t%s\n' "$label" "$code" >> diagnostic/outcomes.tsv
          return 0
        }
        record native python scripts/windows-native-proof native "$RUNNER_TEMP/windows-native-proof"
        if [ "$STAGE" = transport-trust ]; then
         export CARGO_TARGET_DIR="$RUNNER_TEMP/windows-native-proof/target"
         export RUSTFLAGS='-C target-feature=+crt-static'
         export RUSTUP_TOOLCHAIN=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])")
         unset CARGO_ENCODED_RUSTFLAGS
         record trust-fetch cargo fetch --locked --target x86_64-pc-windows-msvc
         record transport-trust cargo test --offline --locked --target x86_64-pc-windows-msvc -p thinkthen --no-default-features --features native --test transport_trust -- --nocapture
        else
         record "$STAGE" python scripts/windows-native-proof "$STAGE" "$RUNNER_TEMP/windows-native-proof"
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-${{ matrix.stage }}
        path: diagnostic/
        if-no-files-found: warn
        retention-days: 7
    - name: Report every outcome
      if: always()
      shell: bash
      run: |
        cat diagnostic/outcomes.tsv
        awk -F '\t' '$2 != 0 { bad=1 } END { exit bad }' diagnostic/outcomes.tsv
  windows-r:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: Verify exact product source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
    - name: Prepare and build current Windows R independently
      if: always()
      run: |
        mkdir -p diagnostic
        record() {
          label="$1"; shift
          set +e
          "$@" 2>&1 | tee "diagnostic/$label.log"
          code=${PIPESTATUS[0]}
          printf '%s\t%s\n' "$label" "$code" >> diagnostic/outcomes.tsv
          return 0
        }
        record windows-r-prepare python3 scripts/release_windows_r.py prepare
        record windows-r-build python3 scripts/release_windows_r.py build windows-r
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-windows-r
        path: windows-r/
        if-no-files-found: warn
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-r-diagnostic
        path: diagnostic/
        if-no-files-found: warn
        retention-days: 7
    - name: Report every outcome
      if: always()
      shell: bash
      run: |
        cat diagnostic/outcomes.tsv
        awk -F '\t' '$2 != 0 { bad=1 } END { exit bad }' diagnostic/outcomes.tsv
  producer-linux-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PM_JOB: release-${{ github.run_id }}
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: source-and-host
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
        uname -a
        python3 --version
        rustc --version
        cargo --version
        for tool in node npm java dotnet go ruby Rscript swift docker; do command -v "$tool" || true; done
        df -h .
        python3 -c 'import pathlib; print("prepared tools:", pathlib.Path.home().joinpath(".local/share/thinkthen-build-tools").exists())'
        ) 2>&1 | tee "sweep-evidence/source-and-host.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "source-and-host" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/uv
          ~/.local/share/uv
          ~/.local/share/thinkthen-build-tools
        key: release-tools-linux-x86_64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**',
          'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION')
          }}
        restore-keys: release-tools-linux-x86_64-
    - name: prepare-linux-input
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        scripts/release-workflow prepare linux-x86_64
        ) 2>&1 | tee "sweep-evidence/prepare-linux-input.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "prepare-linux-input" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - name: export-linux-input
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        . scripts/native-tools-env
        THINKTHEN_FLOOR_IMAGE=$(docker image inspect thinkthen-floor-build:glibc2.28 --format '{{.Id}}')
        export THINKTHEN_FLOOR_IMAGE
        native=$(scripts/native-prepare)
        echo "floor_image=$THINKTHEN_FLOOR_IMAGE" >> "$GITHUB_OUTPUT"
        mkdir -p gate-assets
        scripts/native-pair export gate-assets/pair.json
        python3 - "$native" <<'PYTHON'
        import json, shutil, sys
        from pathlib import Path
        source = Path(sys.argv[1])
        for name in json.loads(Path('gate-assets/pair.json').read_text())['assets']:
            destination = Path('gate-assets/assets') / name
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(source / name, destination)
        PYTHON
        ) 2>&1 | tee "sweep-evidence/export-linux-input.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "export-linux-input" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
      id: native
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: gate-linux-x86_64
        path: gate-assets/
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: evidence-producer-linux-input
        path: sweep-evidence/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve failed stage result
      if: always()
      run: |-
        test -f sweep-evidence/results.tsv
        awk -F '\t' '$2 != 0 { failed=1 } END { exit failed }' sweep-evidence/results.tsv
    outputs:
      floor_image: ${{ steps.native.outputs.floor_image }}
  package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PM_JOB: release-${{ github.run_id }}
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SHA: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: source-and-host
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
        uname -a
        python3 --version
        rustc --version
        cargo --version
        for tool in node npm java dotnet go ruby Rscript swift docker; do command -v "$tool" || true; done
        df -h .
        python3 -c 'import pathlib; print("prepared tools:", pathlib.Path.home().joinpath(".local/share/thinkthen-build-tools").exists())'
        ) 2>&1 | tee "sweep-evidence/source-and-host.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "source-and-host" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/uv
          ~/.local/share/uv
          ~/.local/share/thinkthen-build-tools
        key: release-tools-${{ matrix.target || 'linux-x86_64' }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*',
          'scripts/*prepare*', 'scripts/floors/**', 'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml',
          'sdk/r/DESCRIPTION') }}
        restore-keys: release-tools-${{ matrix.target || 'linux-x86_64' }}-
    - name: prepare-package
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        scripts/release-workflow prepare "$RELEASE_TARGET"
        ) 2>&1 | tee "sweep-evidence/prepare-package.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "prepare-package" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - name: prepare-linux-runtime-images
      if: always() && startsWith(matrix.target, 'linux-')
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        scripts/qualification-linux --prepare
        ) 2>&1 | tee "sweep-evidence/prepare-linux-runtime-images.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "prepare-linux-runtime-images" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - name: build-and-installed-checks
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        scripts/release-workflow build "$RELEASE_TARGET" release-files "$RELEASE_SHA"
        ) 2>&1 | tee "sweep-evidence/build-and-installed-checks.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "build-and-installed-checks" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - name: qualify-native-runtime-floor
      if: always() && matrix.target != 'windows-x86_64'
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        . scripts/native-tools-env
        scripts/qualification-candidate "$RELEASE_TARGET" release-files/candidate "$RELEASE_SHA"
        ) 2>&1 | tee "sweep-evidence/qualify-native-runtime-floor.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "qualify-native-runtime-floor" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - name: validate-package-source-and-digests
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        python3 - "$RELEASE_TARGET" "$RELEASE_SHA" <<'PYTHON'
        import sys, json, hashlib
        from pathlib import Path
        sys.path.insert(0,'scripts')
        from release_workflow import validate, version
        p=Path('release-files/candidate') / version() / sys.argv[1]
        validate(p,sys.argv[1],sys.argv[2])
        print((p/'build.json').read_text())
        print((p/'SHA256SUMS').read_text())
        for p in Path('release-files').glob('*.tar.gz'):
         print(hashlib.sha256(p.read_bytes()).hexdigest(),p)
        PYTHON
        ) 2>&1 | tee "sweep-evidence/validate-package-source-and-digests.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "validate-package-source-and-digests" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: platform-${{ matrix.target }}
        path: release-files/*.tar.gz
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: evidence-package-${{ matrix.target }}
        path: sweep-evidence/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve failed stage result
      if: always()
      run: |-
        test -f sweep-evidence/results.tsv
        awk -F '\t' '$2 != 0 { failed=1 } END { exit failed }' sweep-evidence/results.tsv
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: linux-x86_64
          runner: ubuntu-24.04
        - target: linux-arm64
          runner: ubuntu-24.04-arm
        - target: macos-arm64
          runner: macos-15
  windows-package-check:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PM_JOB: release-${{ github.run_id }}
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      RELEASE_SHA: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: source-and-host
      if: always()
      continue-on-error: true
      run: |-
        mkdir -p sweep-evidence
        set +e
        ( set -e
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
        uname -a
        python3 --version
        rustc --version
        cargo --version
        for tool in node npm java dotnet go ruby Rscript swift docker; do command -v "$tool" || true; done
        df -h .
        python3 -c 'import pathlib; print("prepared tools:", pathlib.Path.home().joinpath(".local/share/thinkthen-build-tools").exists())'
        ) 2>&1 | tee "sweep-evidence/source-and-host.log"
        rc=${PIPESTATUS[0]}
        printf "%s\t%s\n" "source-and-host" "$rc" >> sweep-evidence/results.tsv
        exit "$rc"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: always()
