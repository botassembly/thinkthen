name: release-prepare

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version to build from this source revision (v0.2.0)
        required: true
        type: string
      prior_run_id:
        description: Reuse qualified Linux and Mac products for a Windows-only retry
        required: false
        default: ''
        type: string
      dry_run:
        description: Qualify every package without creating a release draft
        required: true
        default: true
        type: boolean

permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      retry: ${{ steps.retry.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - name: Refuse sources outside main before preparing or building
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            scripts/qualification-source "$TAG"
          else
            scripts/qualification-source --dispatch "$RELEASE_TAG"
          fi
      - id: retry
        name: Verify prior qualification and unchanged product source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$PRIOR_RUN_ID" ]; then
            test "$DRY_RUN" = true
            python3 scripts/release_retry.py "$PRIOR_RUN_ID" reuse
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          python3 -c 'import json,sys; sys.path.insert(0,"scripts"); from release_retry import git,manifest; from pathlib import Path; Path("source-manifest.json").write_text(json.dumps(manifest(git("rev-parse","HEAD").decode().strip()),sort_keys=True,indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source-manifest
          path: source-manifest.json
          if-no-files-found: error
          retention-days: 7
      - if: steps.retry.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-reuse
          path: reuse/
          if-no-files-found: error
          retention-days: 7
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release-workflow resolve "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  qualification:
    # Source refusal always runs; the existing release flag still holds builds.
    if: vars.RELEASE_ARMED == 'true'
    needs: source
    permissions: {contents: read}
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ needs.source.outputs.sha }}
      matrix: ${{ needs.source.outputs.matrix }}
      windows_retry: ${{ needs.source.outputs.retry == 'true' }}

  bundle:
    needs: [source, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read}
    outputs:
      artifact-ready: ${{ steps.upload-release.outcome == 'success' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: platform-*
          path: platforms
      - if: needs.source.outputs.retry == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: qualified-reuse, path: platforms/reused}
      - if: needs.source.outputs.retry == 'true'
        name: Select verified prior platform provenance
        run: echo "THINKTHEN_RELEASE_REUSE=$GITHUB_WORKSPACE/platforms/reused/reuse.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - name: Prepare registry package tools
        run: |
          scripts/jvm-prepare
          scripts/csharp-prepare
          scripts/release-workflow prepare-registry
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from release_rust import prepare; prepare()'
          cargo fetch --locked
      - name: Bundle every checked platform and its install guide
        id: bundle-platforms
        if: always()
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          . scripts/native-tools-env
          scripts/release-workflow bundle platforms release "$RELEASE_SHA"
      - name: Build and validate the final registry packages
        id: registry-packages
        if: always()
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          . scripts/native-tools-env
          scripts/release-workflow registry platforms registries "$RELEASE_SHA"
      - name: Install the final Rust crate offline
        id: crate-install
        if: always()
        run: |
          . scripts/native-tools-env
          scripts/crate-install-check registries/crates
      - name: Attach registry packages and verify complete release checksums
        id: attach-registries
        if: always()
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release-workflow attach registries release "$RELEASE_SHA"
      - name: Admit the complete release before transporting it to consumers
        id: admit-release
        if: always() && steps.attach-registries.outcome == 'success'
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: scripts/release-workflow draft release "$RELEASE_TAG" "$RELEASE_SHA" --dry-run
      - name: Explain why installed consumers have no candidate
        id: no-release-artifact
        if: always() && steps.admit-release.outcome != 'success'
        run: echo 'Registry platform installs skipped because no complete checksum-validated release artifact exists.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-release
        if: always() && steps.admit-release.outcome == 'success'
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Report every release assembly failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  registry-installed:
    needs: [source, bundle]
    if: always() && needs.bundle.outputs.artifact-ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions: {contents: read}
    env:
      PYTHONUTF8: '1'
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        if: always()
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: setup-node
        if: always()
        with: {node-version: '22.12.0'}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        id: setup-java
        if: always()
        with: {distribution: temurin, java-version: '22.0.2+9'}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: setup-dotnet
        if: always()
        with: {dotnet-version: '10.0.103'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: release-artifact
        if: always()
        with: {name: release, path: release}
      - name: Install every final registry package on its target platform
        id: installed-registry-packages
        if: always()
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release-platform-check release "$RELEASE_SHA" "$RUNNER_TEMP/registry-installed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-installed-${{ matrix.runner }}
          path: ${{ runner.temp }}/registry-installed/results.json
          retention-days: 7
      - name: Report every installed package failure
        if: always()
        env:
          QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/qualification-summary

  draft:
    needs: [source, bundle, registry-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: release, path: release}
      - if: needs.source.outputs.retry == 'true'
        name: Select verified provenance for the draft rehearsal
        run: echo "THINKTHEN_RELEASE_REUSE=$GITHUB_WORKSPACE/release/reuse.json" >> "$GITHUB_ENV"
      # Each matched file becomes a subject with its own digest in the provenance.
      # https://github.com/actions/attest/tree/v4.2.2#identify-multiple-subjects
      - name: Attest every release asset
        if: needs.source.outputs.retry != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release/*'
          create-storage-record: false
      - name: Attest the release assembly with each original product source
        if: needs.source.outputs.retry == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release/*'
          predicate-type: https://github.com/botassembly/thinkthen/attestations/release-assembly/v1
          predicate-path: release/reuse.json
          create-storage-record: false
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            scripts/release-workflow draft release "$RELEASE_TAG" "$RELEASE_SHA" --dry-run
          else
            scripts/release-workflow draft release "$RELEASE_TAG" "$RELEASE_SHA"
          fi
