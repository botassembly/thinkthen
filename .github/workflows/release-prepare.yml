        shared=[n for n in block.body if n.lineno<=133]
        shared.append(ast.ImportFrom(module='release_windows_cache',names=[ast.alias(name='check_cache')],level=0))
        chosen=[n for n in block.body if start<=n.lineno<=end]
        if mode in ('java','kotlin'):
            chosen[0].iter=ast.List(elts=[ast.Tuple(elts=[ast.Constant(mode),ast.Constant('ConsumerCases' if mode=='java' else 'KotlinCasesKt')],ctx=ast.Load())],ctx=ast.Load())
        if mode in ('sqlite','duckdb'):
            chosen[0].iter=ast.Tuple(elts=[ast.Constant(mode)],ctx=ast.Load())
        block.body=shared+chosen
        full.body=[n for n in full.body if n.lineno<122]+[block]
        if mode in ('c','cpp'):
            helper=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='c_and_cpp')
            cpp_start=next(n.lineno for n in helper.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='cpp' for t in n.targets))
            if mode=='c':helper.body=[n for n in helper.body if n.lineno<cpp_start]
            else:
                helper.body=[n for n in helper.body if n.lineno>=cpp_start or (isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id in ('c','spec','native_cases','registry') for t in n.targets)) or isinstance(n,ast.Import) or (isinstance(n,ast.Expr) and isinstance(n.value,ast.Call) and isinstance(n.value.func,ast.Attribute) and n.value.func.attr=='exec_module')]
        if mode in ('swift','zig'):
            helper=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='swift_and_zig')
            zig_start=next(n.lineno for n in helper.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='zig' for t in n.targets))
            helper.body=[n for n in helper.body if (n.lineno<zig_start if mode=='swift' else n.lineno>=zig_start)]
        tree.body=[n for n in tree.body if not (isinstance(n,ast.If) and isinstance(n.test,ast.Compare) and isinstance(n.test.left,ast.Name) and n.test.left.id=='__name__')]
        namespace={'__name__':'diagnostic_source_blocks','__file__':str(path)}
        exec(compile(ast.fix_missing_locations(tree),str(path),'exec'),namespace)
        namespace['full'](folder,json.loads((folder/'build.json').read_text()),caller_owned=True)
        print('installed candidate surface complete:',mode,flush=True)
        DIAGNOSTIC
    - name: Check selected installed surface
      if: always()
      continue-on-error: true
      run: "mkdir -p sweep-evidence\nset +e\npython3 \"$RUNNER_TEMP/installed-surface.py\" \"$SWEEP_SURFACE\" windows-installed/0.2.0/windows-x86_64 2>&1 | tee \"\
        sweep-evidence/installed-$SWEEP_SURFACE.log\"\nrc=${PIPESTATUS[0]}\nprintf \"%s\t%s\n\" \"installed-$SWEEP_SURFACE\" \"$rc\" >> sweep-evidence/results.tsv\n\
        exit \"$rc\""
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: evidence-windows-installed-${{ matrix.surface }}
        path: sweep-evidence/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve failed stage result
      if: always()
      run: |-
        test -f sweep-evidence/results.tsv
        awk -F '\t' '$2 != 0 { failed=1 } END { exit failed }' sweep-evidence/results.tsv
    needs: package-windows
    if: always()
    strategy:
      fail-fast: false
      matrix:
        surface:
        - python
        - typescript
        - go
        - java
        - kotlin
        - csharp
        - ruby
        - r
        - c
        - cpp
        - swift
        - zig
        - sqlite
        - duckdb
        - source-installs
        - readme-examples
  macos-input:
    needs: producer-linux-input
    if: always()
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.13'
    - name: Verify exact product source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = a5ceb0badc76edcb8ebe2209f8b29bf8b47e43f8
        git rev-parse HEAD
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/uv
          ~/.local/share/uv
          ~/.local/share/thinkthen-build-tools
        key: release-tools-macos-arm64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'rust-toolchain.toml', 'scripts/native*', 'scripts/*prepare*', 'scripts/floors/**',
          'scripts/release-tools.json', 'scripts/runtime-floors.json', 'sdk/**/pom.xml', 'sdk/**/package-lock.json', 'sdk/**/pyproject.toml', 'sdk/r/DESCRIPTION')
          }}
        restore-keys: release-tools-macos-arm64-
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: gate-linux-x86_64
        path: ${{ runner.temp }}/gate-assets
    - name: Prepare shared macOS tools and native inputs once
      if: always()
      run: |
        mkdir -p diagnostic
        record() {
          label="$1"; shift
          set +e
          "$@" 2>&1 | tee "diagnostic/$label.log"
          code=${PIPESTATUS[0]}
          printf '%s\t%s\n' "$label" "$code" >> diagnostic/outcomes.tsv
          return 0
        }
        record release-prepare scripts/release-workflow prepare macos-arm64
        record gate-prepare scripts/qualification-gate-prepare
        record pair-import bash -c '. scripts/native-tools-env; scripts/native-pair import "$RUNNER_TEMP/gate-assets/pair.json" "$RUNNER_TEMP/gate-assets/assets"'
        set +e
        . scripts/native-tools-env
        THINKTHEN_FLOOR_IMAGE=$(scripts/native-pair image)
        export THINKTHEN_FLOOR_IMAGE
        record native-prepare scripts/native-prepare
        record test-assets scripts/native-test-assets prepare
        record abi-assets scripts/native-abi-assets prepare
        record native-env bash -c '. scripts/native-env'
    - name: Archive existing prepared inputs
      if: always()
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/macos-input"
        paths=()
        for path in .local/share/thinkthen-build-tools .local/share/uv .cache/uv .local/bin .cargo/registry .cargo/git; do
          if [ -e "$HOME/$path" ]; then paths+=("$path"); fi
        done
        channel=$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel'])")
        for path in "$HOME/.rustup/toolchains/$channel"-*; do
          if [ -d "$path" ]; then paths+=("${path#"$HOME/"}"); fi
        done
        printf '%s\n' "${paths[@]}" > diagnostic/prepared-paths.txt
        tar -cf "$RUNNER_TEMP/macos-input/prepared.tar" -C "$HOME" "${paths[@]}"
        shasum -a 256 "$RUNNER_TEMP/macos-input/prepared.tar" > diagnostic/prepared-tar.sha256
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-prepared-input
        path: ${{ runner.temp }}/macos-input/prepared.tar
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-input-diagnostic
        path: diagnostic/
        if-no-files-found: warn
        retention-days: 7
    - name: Report every outcome
      if: always()
      shell: bash
      run: |
        cat diagnostic/outcomes.tsv
        awk -F '\t' '$2 != 0 { bad=1 } END { exit bad }' diagnostic/outcomes.tsv
