# A dispatch never publishes without the release
# environment, RELEASE_ARMED, and a separate approval for each outward job.
# Packagist and R-universe have no job: each reads the published repository.
# Rehearsal cannot dry-run PyPI upload, gem push, NuGet push, Maven upload,
# the tap push, the GitHub release, or the Go tag. Trusted publishers need a release run.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a rehearsal draft or release the selected v* tag
        type: choice
        required: true
        options: [rehearse, release]

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      name: ${{ steps.source.outputs.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: source
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sdlc/scripts/release-workflow resolve "$MODE" "$REF" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          # Passed 5146s; run/job 39066497222/117495205500; ceil(2x/60).
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, minutes: 172, job_minutes: 177, setup_minutes: 172, pack_minutes: 172}
          # Passed 4513s; run/job 39102241482/117600734565; ceil(2x/60).
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, minutes: 151, job_minutes: 156, setup_minutes: 5, pack_minutes: 146}
          # Passed 4581s; run/job 39102241482/117600734572; ceil(2x/60).
          - {target: aarch64-apple-darwin, runner: macos-15, minutes: 153, job_minutes: 158, setup_minutes: 58, pack_minutes: 94}
          # Passed 3h28m22s (12502s); run/job 39102241482/117600734673.
          # 2x needs 417m; GitHub-hosted jobs cap at 360m. Keep the existing cap.
          - {target: x86_64-apple-darwin, runner: macos-15-intel, minutes: 360, job_minutes: 360, setup_minutes: 199, pack_minutes: 215}
          # Passed 1514s; run/job 39102241482/117600734615; ceil(2x/60).
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, minutes: 51, job_minutes: 56, setup_minutes: 2, pack_minutes: 48}
    # Passing setup/pack seconds from the same jobs above:
    # ARM Linux124/4371; ARM Mac1711/2814; Intel Mac5957/6436; Windows46/1431.
    # Linux x86 retains its complete-job bound for either step.
    # Uploads are best effort if the runner or entire job is cancelled.
    defaults: {run: {shell: bash}}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_minutes }}
    permissions: {contents: read}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Keep Windows line endings as committed
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - name: Isolate Windows default folders
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"
      # Keep the wheel floor separate from the interpreter running repository tools.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: python-floor
        with: {python-version: '3.10'}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - name: Select x64 MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"
      - name: Install and check the pinned host tools
        timeout-minutes: ${{ matrix.setup_minutes }}
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          sdlc/scripts/release-workflow host-setup "$TARGET"
      - name: Read the JVM runtime floor
        id: jvm-contract
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - name: Select managed language tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          python3 sdlc/scripts/release-language-tools.py managed "$RUNNER_TEMP/thinkthen-language-managed" "$SHA" --acquire
      - name: Check every prepared build input
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          python3 sdlc/scripts/hosted-preflight.py build "$TARGET"
      - name: Build and pack the target
        timeout-minutes: ${{ matrix.pack_minutes }}
        env: {TARGET: "${{ matrix.target }}", THINKTHEN_RELEASE_EXPECTED_SHA: "${{ needs.resolve.outputs.sha }}", PYO3_PYTHON: "${{ steps.python-floor.outputs.python-path }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          set -eu
          mkdir -p release-files
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            cargo clippy --locked --offline --workspace --all-targets -- -D warnings
            cargo test --locked --offline --no-fail-fast --workspace --all-targets
            cargo clippy --locked --offline --manifest-path libraries/c/Cargo.toml --all-targets -- -D warnings
            cargo test --locked --offline --manifest-path libraries/c/Cargo.toml --no-fail-fast
            CARGO_NET_OFFLINE=true sdlc/scripts/release-pack "$TARGET" release-files command c python typescript first-run
            python3 sdlc/scripts/release-windows-command.py platform release-files "$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)"
          elif [ "$(uname -s)" = Linux ]; then
            # Ticket 0366: log free space and our big folders at each stage.
            disk() {
              sdlc/scripts/release-workflow disk "$1" "$HOME/.cargo/registry" "$HOME/.rustup" \
                "$HOME/.cache/thinkthen-toolchains" "$RUNNER_TEMP/thinkthen-language-managed" \
                "$RUNNER_TEMP/thinkthen-provenance-x86" "${work:-}" release-files target
            }
            disk 'after host setup and language tools'
            export RELEASE_CARGO_REGISTRY="$HOME/.cargo/registry"
            if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
              mkdir -p "$RUNNER_TEMP/thinkthen-provenance-x86"
              sdlc/scripts/release-workflow source-capture "$RUNNER_TEMP/thinkthen-provenance-x86" "$THINKTHEN_RELEASE_EXPECTED_SHA"
              export THINKTHEN_RELEASE_SOURCE_TAR="$RUNNER_TEMP/thinkthen-provenance-x86/source.tar"
              export THINKTHEN_RELEASE_SOURCE_RECEIPT="$RUNNER_TEMP/thinkthen-provenance-x86/source.json"
            fi
            work=$(sdlc/scripts/release-workflow linux-work "$RUNNER_TEMP/thinkthen-container")
            sdlc/scripts/release-container "$work" release-files
            disk 'after the container'
            if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
              sdlc/scripts/release-workflow c-capture "release-files/thinkthen-c-$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)-$TARGET.tar.gz" "$RUNNER_TEMP/thinkthen-provenance-x86" "$TARGET"
              sdlc/scripts/release-workflow managed-build "$RUNNER_TEMP/thinkthen-provenance-x86" release-files "$TARGET" "$THINKTHEN_RELEASE_EXPECTED_SHA"
              disk 'after the managed build'
            fi
            sdlc/scripts/release-pack "$TARGET" release-files command first-run
            disk 'after the final pack'
          else
            # Each PostgreSQL archive selects its server's pg_config.
            sdlc/scripts/release-pack "$TARGET" release-files
          fi
      - name: Pack the built Mac DuckDB hosts
        if: runner.os == 'macOS'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-build.log") 2>&1
          sdlc/scripts/release-workflow duckdb-host-pack duckdb-hosts "$TARGET" "$SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          name: duckdb-hosts-${{ needs.resolve.outputs.version }}-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}
          path: duckdb-hosts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.target }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: provenance-x86
          path: ${{ runner.temp }}/thinkthen-provenance-x86/
          if-no-files-found: error
          retention-days: 7
      - name: Retain available build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/release-build.log
          if-no-files-found: warn
          retention-days: 7

  apple-packages:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-apple-darwin, runner: macos-15}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
    defaults: {run: {shell: bash}}
    runs-on: ${{ matrix.runner }}
    # Current job has no applicable passing duration in bounded history.
    # Retain 60m pending 0691; step timeout leaves an upload reserve.
    timeout-minutes: 60
    permissions: {contents: read, actions: read}
    env: {MACOSX_DEPLOYMENT_TARGET: '15.0'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*-apple-darwin', path: target/apple-inputs}
      - name: Assemble Swift and Foundation from both captured C packages
        env: {TARGET: "${{ matrix.target }}", THINKTHEN_RELEASE_EXPECTED_SHA: "${{ needs.resolve.outputs.sha }}"}
        timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/apple-packages.log") 2>&1
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          for arch in x86_64 aarch64; do
            input="target/apple-inputs/platform-$arch-apple-darwin"
            name="thinkthen-c-$version-$arch-apple-darwin.tar.gz"
            (cd "$input" && shasum -a 256 -c "$name.sha256")
            mkdir "target/apple-$arch"
            tar -xzf "$input/$name" -C "target/apple-$arch"
            cmp "target/apple-$arch/include/thinkthen.h" libraries/c/include/thinkthen.h
          done
          sh libraries/swift/build-xcframework.sh target/apple-x86_64 target/apple-aarch64 target/apple-framework
          cp -R target/apple-framework/CThinkThen.xcframework libraries/swift/
          mkdir target/apple-packages
          cp "target/apple-inputs/platform-$TARGET/thinkthen-c-$version-$TARGET.tar.gz"* target/apple-packages/
          sdlc/scripts/release-pack --apple-wrappers "$TARGET" target/apple-packages swift objective-c
          rm "target/apple-packages/thinkthen-c-$version-$TARGET.tar.gz" "target/apple-packages/thinkthen-c-$version-$TARGET.tar.gz.sha256"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.22.3'}
      - name: Prepare the installed Apple consumer dependencies
        timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/apple-packages.log") 2>&1
          set -eu
          rustup toolchain install 1.95.0 --profile minimal
          cargo fetch --locked
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          CARGO_NET_OFFLINE=true python3 sdlc/scripts/build-admission.py -- cargo build --locked --offline -p conformance-backend
      - name: Qualify installed Swift and Objective-C Foundation
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}", THINKTHEN_TEST_PROFILE: full}
        timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/apple-packages.log") 2>&1
          set -eu
          sdlc/scripts/release-workflow apple-check "$TARGET" target/apple-packages swift "$SHA"
          sdlc/scripts/release-workflow apple-check "$TARGET" target/apple-packages objective-c "$SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: 'apple-packages-${{ matrix.target }}', path: target/apple-packages/, if-no-files-found: error, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: 'apple-framework-${{ matrix.target }}', path: libraries/swift/CThinkThen.xcframework/, if-no-files-found: error, retention-days: 7}
      # Available logs survive a step timeout; runner/setup or whole-job
      # cancellation can still prevent this upload.
      - name: Retain available long-job logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-packages-${{ matrix.target }}-logs
          path: ${{ runner.temp }}/apple-packages.log
          if-no-files-found: warn
          retention-days: 7

  wheels:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow verify-family platform 'thinkthen-*.whl' 5
      - run: python3 -m pip install 'twine==6.2.0'
      - run: python3 -m twine check --strict platform/*/thinkthen-*.whl

  gems:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow verify-family platform 'thinkthen-*.gem' 5

  npm-pack:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow npm-assemble platform npm-dist
      # The npm job publishes this same path with this same npm; the dry run proves npm reads it as a file.
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        run: |
          npm install --global npm@11.15.0
          npm stage publish --dry-run "./npm-dist/thinkthen-$VERSION.tgz" --access public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: npm-package, path: npm-dist/, if-no-files-found: error, retention-days: 7}

  crate:
    needs: resolve
    runs-on: ubuntu-24.04
    # Current job has no applicable passing duration in bounded history.
    # Retain 60m pending 0691; step timeout leaves an upload reserve.
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.22.3'}
      - name: Check binding samples on the resolved tagged commit
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          test "$(git rev-parse HEAD)" = "$SHA"
          node site/scripts/check-binding-samples.mjs
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          rustup toolchain install 1.95.0 --profile minimal
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo fetch --locked
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo fetch --locked --manifest-path conformance/consumer/Cargo.toml
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo fetch --locked --manifest-path libraries/rust/consumer/Cargo.toml
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo fetch --locked --manifest-path libraries/python/Cargo.toml
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          sh sdlc/scripts/package
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo publish --dry-run --locked --package thinkthen
      - timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          cargo fetch --locked --manifest-path libraries/r/thinkthen/src/rust/Cargo.toml
      - name: Build the R source package from the published crate
        timeout-minutes: 55
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/crate.log") 2>&1
          CARGO_NET_OFFLINE=true sh sdlc/scripts/release-pack x86_64-unknown-linux-gnu r-dist r
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: r-package, path: r-dist/, if-no-files-found: error, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: crate-package, path: target/package/*.crate, if-no-files-found: error, retention-days: 7}
      # Available logs survive a step timeout; runner/setup or whole-job
      # cancellation can still prevent this upload.
      - name: Retain available long-job logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-logs
          path: ${{ runner.temp }}/crate.log
          if-no-files-found: warn
          retention-days: 7

  registries:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform, merge-multiple: true}
      - name: Install the pinned Dart
        run: sdlc/scripts/release-workflow dart-tools x86_64-unknown-linux-gnu "$RUNNER_TEMP/thinkthen-registry-dart"
      - name: Pack and check the NuGet, Maven and pub packages
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          sdlc/scripts/release-workflow registry-pack platform registry "$SHA"
          sdlc/scripts/release-workflow maven-sign registry/maven rehearse
          sdlc/scripts/release-workflow pub-dry-run registry/pub/thinkthen_dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: registry-packages, path: registry/, if-no-files-found: error, retention-days: 7}

  windows-sdks:
    needs: [resolve, npm-pack, registries]
    runs-on: windows-2025
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    defaults: {run: {shell: bash}}
    permissions: {contents: read, actions: read}
    steps:
      - name: Keep line endings as committed
        timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/windows-sdks.log") 2>&1
          git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with: {dotnet-version: '8.0.131'}
      - name: Read the stable JVM runtime floor
        id: jvm-contract
        timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/windows-sdks.log") 2>&1
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      - name: Install the final Windows Node, C#, Java, Kotlin and Scala SDK packages
        timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/windows-sdks.log") 2>&1
          python3 sdlc/scripts/release-windows-sdk-smoke.py npm-dist registry
      # Available logs survive a step timeout; runner/setup or whole-job
      # cancellation can still prevent this upload.
      - name: Retain available long-job logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-sdks-logs
          path: ${{ runner.temp }}/windows-sdks.log
          if-no-files-found: warn
          retention-days: 7

  smoke:
    needs: [resolve, build, apple-packages, wheels, npm-pack, gems, crate]
    # Historic setup includes DuckDB compilation removed by 0613. These bounds
    # deliberately retain that measured cost; they are not new setup timings.
    # The component comments below identify actual source job IDs.
    # 0691 measures each complete new job before replacing these provisional bounds.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Provisional 2x component bound: 4714s setup + 3673s consumer.
          # Jobs: 117533117689: setup and complete installed bundle.
