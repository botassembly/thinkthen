          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: ruby, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: sqlite, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: duckdb, minutes: 280, job_minutes: 285, consumer_minutes: 123}
