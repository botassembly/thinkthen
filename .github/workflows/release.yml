# A dispatch never publishes without the release
# environment, RELEASE_ARMED, and a separate approval for each outward job.
# Packagist and R-universe have no job: each reads the published repository.
# Rehearsal cannot dry-run PyPI upload, gem push, NuGet push, Maven upload,
# the tap push, the GitHub release, or the Go tag. Trusted publishers need a release run.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a rehearsal draft or release the selected v* tag
        type: choice
        required: true
        options: [rehearse, release]

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      name: ${{ steps.source.outputs.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: source
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sdlc/scripts/release-workflow resolve "$MODE" "$REF" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: aarch64-apple-darwin, runner: macos-15}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025}
    defaults: {run: {shell: bash}}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Keep Windows line endings as committed
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - name: Isolate Windows default folders
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: runner.os == 'macOS'
        with: {python-version: '3.13'}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.10'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - name: Select x64 MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"
      - name: Install and check the pinned host tools
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow host-setup "$TARGET"
      - name: Read the JVM runtime floor
        id: jvm-contract
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - name: Select managed language tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: python3 sdlc/scripts/release-language-tools.py managed "$RUNNER_TEMP/thinkthen-language-managed" "$SHA" --acquire
      - name: Build and pack the target
        env: {TARGET: "${{ matrix.target }}", THINKTHEN_RELEASE_EXPECTED_SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          set -eu
          mkdir -p release-files
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            cargo clippy --locked --offline --workspace --all-targets -- -D warnings
            cargo test --locked --offline --no-fail-fast --workspace --all-targets
            cargo clippy --locked --offline --manifest-path libraries/c/Cargo.toml --all-targets -- -D warnings
            cargo test --locked --offline --manifest-path libraries/c/Cargo.toml --no-fail-fast
            CARGO_NET_OFFLINE=true sdlc/scripts/release-pack "$TARGET" release-files command c python typescript first-run
            python3 sdlc/scripts/release-windows-command.py platform release-files "$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)"
          elif [ "$(uname -s)" = Linux ]; then
            # Ticket 0366: log free space and our big folders at each stage.
            disk() {
              sdlc/scripts/release-workflow disk "$1" "$HOME/.cargo/registry" "$HOME/.rustup" \
                "$HOME/.cache/thinkthen-toolchains" "$RUNNER_TEMP/thinkthen-language-managed" \
                "$RUNNER_TEMP/thinkthen-provenance-x86" "${work:-}" release-files target
            }
            disk 'after host setup and language tools'
            export RELEASE_CARGO_REGISTRY="$HOME/.cargo/registry"
            if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
              mkdir -p "$RUNNER_TEMP/thinkthen-provenance-x86"
              sdlc/scripts/release-workflow source-capture "$RUNNER_TEMP/thinkthen-provenance-x86" "$THINKTHEN_RELEASE_EXPECTED_SHA"
              export THINKTHEN_RELEASE_SOURCE_TAR="$RUNNER_TEMP/thinkthen-provenance-x86/source.tar"
              export THINKTHEN_RELEASE_SOURCE_RECEIPT="$RUNNER_TEMP/thinkthen-provenance-x86/source.json"
            fi
            work=$(sdlc/scripts/release-workflow linux-work "$RUNNER_TEMP/thinkthen-container")
            sdlc/scripts/release-container "$work" release-files
            disk 'after the container'
            if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
              sdlc/scripts/release-workflow c-capture "release-files/thinkthen-c-$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)-$TARGET.tar.gz" "$RUNNER_TEMP/thinkthen-provenance-x86" "$TARGET"
              sdlc/scripts/release-workflow managed-build "$RUNNER_TEMP/thinkthen-provenance-x86" release-files "$TARGET" "$THINKTHEN_RELEASE_EXPECTED_SHA"
              disk 'after the managed build'
            fi
            sdlc/scripts/release-pack "$TARGET" release-files command first-run
            disk 'after the final pack'
          else
            RUBY="$HOME/.cache/thinkthen-toolchains/ruby/3.4.11-$(uname -m)-darwin/bin/ruby"
            PG_CONFIG="$(brew --prefix postgresql@16)/bin/pg_config"
            export RUBY PG_CONFIG
            sdlc/scripts/release-pack "$TARGET" release-files
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.target }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: provenance-x86
          path: ${{ runner.temp }}/thinkthen-provenance-x86/
          if-no-files-found: error
          retention-days: 7

  wheels:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions: {actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow verify-family platform 'thinkthen-*.whl' 5
      - run: python3 -m pip install 'twine==6.2.0'
      - run: python3 -m twine check --strict platform/*/thinkthen-*.whl

  gems:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions: {actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow verify-family platform 'thinkthen-*.gem' 5

  npm-pack:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: sdlc/scripts/release-workflow npm-assemble platform npm-dist
      # The npm job publishes this same path with this same npm; the dry run proves npm reads it as a file.
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        run: |
          npm install --global npm@11.15.0
          npm stage publish --dry-run "./npm-dist/thinkthen-$VERSION.tgz" --access public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: npm-package, path: npm-dist/, if-no-files-found: error, retention-days: 7}

  crate:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path conformance/consumer/Cargo.toml
      - run: cargo fetch --locked --manifest-path libraries/python/Cargo.toml
      - run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - run: sh sdlc/scripts/package
      - run: cargo publish --dry-run --locked --package thinkthen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: crate-package, path: target/package/*.crate, if-no-files-found: error, retention-days: 7}

  registries:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform, merge-multiple: true}
      - name: Install the pinned Dart
        run: sdlc/scripts/release-workflow dart-tools x86_64-unknown-linux-gnu "$RUNNER_TEMP/thinkthen-registry-dart"
      - name: Pack and check the NuGet, Maven and pub packages
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          sdlc/scripts/release-workflow registry-pack platform registry "$SHA"
          sdlc/scripts/release-workflow maven-sign registry/maven rehearse
          sdlc/scripts/release-workflow pub-dry-run registry/pub/thinkthen_dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: registry-packages, path: registry/, if-no-files-found: error, retention-days: 7}

  windows-sdks:
    needs: [resolve, npm-pack, registries]
    runs-on: windows-2025
    defaults: {run: {shell: bash}}
    permissions: {contents: read, actions: read}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with: {dotnet-version: '8.0.131'}
      - name: Read the stable JVM runtime floor
        id: jvm-contract
        run: |
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      - name: Install the final Windows Node, C#, Java, Kotlin and Scala SDK packages
        run: python3 sdlc/scripts/release-windows-sdk-smoke.py npm-dist registry

  smoke:
    needs: [resolve, build, wheels, npm-pack, gems, crate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: aarch64-apple-darwin, runner: macos-15}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025}
    defaults: {run: {shell: bash}}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read, actions: read}
    env: {MACOSX_DEPLOYMENT_TARGET: '15.0'}
    steps:
      - name: Keep Windows line endings as committed
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - name: Isolate Windows default folders
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - env: {TARGET: "${{ matrix.target }}", RELEASE_SMOKE: '1'}
        run: sdlc/scripts/release-workflow host-setup "$TARGET"
      - name: Read the JVM runtime floor
        id: jvm-contract
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - name: Select installed language tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: python3 sdlc/scripts/release-language-tools.py smoke "$RUNNER_TEMP/thinkthen-language-smoke" "$SHA" --acquire
      - name: Check and install pinned Go/C++ consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow go-cpp-tools "$TARGET" "$RUNNER_TEMP/thinkthen-go"
      - name: Check and install pinned Swift/Zig consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow swift-zig-tools "$TARGET" "$RUNNER_TEMP/thinkthen-zig"
      - name: Check and install pinned PHP/Dart consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow php-dart-tools "$TARGET" "$RUNNER_TEMP/thinkthen-dart"
      - name: Check Ada, GNU Objective-C and COBOL consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow ada-objc-cobol-tools "$TARGET"
      - name: Check selected managed consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: sdlc/scripts/release-workflow managed-tools "$TARGET"
      - name: Select x64 MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: 'platform-${{ matrix.target }}', path: platform}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {name: provenance-x86, path: provenance}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: crate-package, path: crate-dist}
      - name: Require the selected Go/C++ family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow go-cpp-gate platform "$TARGET" "$SHA"
      - name: Require the selected Swift/Zig family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow swift-zig-gate platform "$TARGET" "$SHA"
      - name: Require the selected PHP/Dart family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow php-dart-gate platform "$TARGET" "$SHA"
      - name: Require the selected Ada/Objective-C/COBOL family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow ada-objc-cobol-gate platform "$TARGET" "$SHA"
      - name: Require the selected managed family and original receipts
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow managed-gate platform "$TARGET" "$SHA" provenance
      - env: {TARGET: "${{ matrix.target }}", THINKTHEN_HEAVY_LOCK: "${{ runner.temp }}/thinkthen-release-smoke.lock"}
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          sdlc/scripts/release-workflow smoke-bundle platform npm-dist smoke-files
          sdlc/scripts/release-smoke smoke-files
          sdlc/scripts/installer-test
          sdlc/scripts/release-workflow installer-smoke smoke-files
          sdlc/scripts/release-workflow crate-smoke crate-dist smoke-files
      - name: Validate and consume the downloaded Windows C archive
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          python3 sdlc/scripts/release-windows-c.py check "platform/thinkthen-c-$version-x86_64-pc-windows-msvc.zip"
          python3 sdlc/scripts/release-windows-c-smoke.py "platform/thinkthen-c-$version-x86_64-pc-windows-msvc.zip"
      - name: Prove the Windows installer and smoke the command and packed Rust crate
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: python3 sdlc/scripts/release-windows-smoke.py platform --crate-dir crate-dist

  draft:
    needs: [resolve, smoke, registries, windows-sdks]
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: provenance-x86, path: provenance}
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        run: sdlc/scripts/release-workflow tap-formula "$VERSION" platform thinkthen.rb
      - run: ruby -c thinkthen.rb
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          NAME: ${{ needs.resolve.outputs.name }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            # Stage 2 bindings and Unix-only families have no Windows release.
            [ "$target" != x86_64-pc-windows-msvc ] || continue
            sdlc/scripts/release-workflow go-cpp-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow swift-zig-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow php-dart-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow ada-objc-cobol-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow managed-gate "platform/platform-$target" "$target" "$SHA" provenance
          done
          sdlc/scripts/release-workflow collect platform npm-dist all-files
          sdlc/scripts/release-workflow draft "$MODE" "$NAME" "$SHA" all-files

  crates:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: rust-lang/crates-io-auth-action@63a7064947ceca9989005e118db3a5fecdc9259f # v1.0.0
        id: auth
      - env: {CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"}
        run: cargo publish --locked --package thinkthen

  pypi:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: |
          mkdir dist
          cp platform/*/thinkthen-*.whl dist/
          [ "$(find dist -name '*.whl' | wc -l)" -eq 5 ]
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  npm:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      # A leading ./ makes npm read a file; npm-dist/x.tgz reads as a GitHub repository.
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        run: |
          npm install --global npm@11.15.0
          npm stage publish "./npm-dist/thinkthen-$VERSION.tgz" --provenance --access public

  rubygems:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with: {ruby-version: '3.4.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0
      - run: |
          [ "$(gem --version)" = 3.6.9 ]
          [ "$(find platform -name 'thinkthen-*.gem' | wc -l)" -eq 5 ]
          for gem in platform/*/thinkthen-*.gem; do gem push "$gem"; done

  tap:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - env: {TAP_DEPLOY_KEY: "${{ secrets.TAP_DEPLOY_KEY }}", VERSION: "${{ needs.resolve.outputs.version }}"}
        run: sdlc/scripts/release-workflow tap "$VERSION" platform

  nuget:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      # Trusted publishing: the run's OIDC token buys a one-hour key, so the login sits just before the push.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with: {user: "${{ vars.NUGET_USER }}"}
      - env: {NUGET_API_KEY: "${{ steps.login.outputs.NUGET_API_KEY }}"}
        run: sdlc/scripts/release-workflow nuget-push registry/nuget/Botassembly.ThinkThen.*.nupkg

  maven:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      - env:
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: sdlc/scripts/release-workflow maven-sign registry/maven release "$RUNNER_TEMP/maven-bundle.zip"
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: sdlc/scripts/release-workflow maven-upload "$RUNNER_TEMP/maven-bundle.zip"

  pub:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      # pub.dev trusted publishing: setup-dart turns the run's OIDC token into the pub.dev token.
      # pub.dev accepts this workflow_dispatch run because it runs on the v* tag ref.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: '3.13.4'}
      - run: sdlc/scripts/release-workflow pub-publish registry/pub/thinkthen_dart

  publish:
    needs: [resolve, draft, crates, pypi, npm, rubygems, tap, nuget, maven, pub]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", NAME: "${{ needs.resolve.outputs.name }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow publish "$NAME" "$SHA"
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", NAME: "${{ needs.resolve.outputs.name }}", VERSION: "${{ needs.resolve.outputs.version }}"}
        run: gh workflow run install-check.yml --ref "$NAME" -f version="$VERSION"
