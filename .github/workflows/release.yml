          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: postgresql17, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: postgresql18, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: installers, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: go-cpp, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: swift-zig, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: php-dart, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: ada-objective-c-cobol, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: managed, minutes: 280, job_minutes: 285, consumer_minutes: 123}
          # Examples have no passing current measurement; retain prior 360m cap until 0691.
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, family: examples, minutes: 355, job_minutes: 360, consumer_minutes: 350}
          # Provisional 2x component bound: 4620s setup + 2095s consumer.
          # Jobs: 117533117655: setup and complete installed bundle.
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: command, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: c, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: python, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: typescript, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: ruby, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: sqlite, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: duckdb, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: postgresql16, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: postgresql17, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: postgresql18, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, family: installers, minutes: 224, job_minutes: 229, consumer_minutes: 70}
          # Provisional 2x component bound: 4025s setup + 731s consumer.
          # Jobs: 117533117652: setup and passing PG16 interval; legacy DuckDB bundle314s at 112104778598.
          - {target: aarch64-apple-darwin, runner: macos-15, family: command, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: c, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: python, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: typescript, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: ruby, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: sqlite, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: duckdb, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: postgresql16, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: postgresql17, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: postgresql18, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: installers, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: swift-zig, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          - {target: aarch64-apple-darwin, runner: macos-15, family: ada-objective-c-cobol, minutes: 159, job_minutes: 164, consumer_minutes: 25}
          # Examples have no passing current measurement; retain prior 360m cap until 0691.
          - {target: aarch64-apple-darwin, runner: macos-15, family: examples, minutes: 355, job_minutes: 360, consumer_minutes: 350}
          # Provisional 2x component bound: 8750s setup + 1256s consumer.
          # Jobs: 117417603551: setup and passing Python interval; legacy DuckDB bundle527s at 112104778577.
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: command, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: c, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: python, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: typescript, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: ruby, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: sqlite, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: duckdb, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: postgresql16, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: postgresql17, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: postgresql18, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: installers, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: swift-zig, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: ada-objective-c-cobol, minutes: 334, job_minutes: 339, consumer_minutes: 42}
          # Examples have no passing current measurement; retain prior 360m cap until 0691.
          - {target: x86_64-apple-darwin, runner: macos-15-intel, family: examples, minutes: 355, job_minutes: 360, consumer_minutes: 350}
          # Provisional 2x component bound: 50s setup + 459s consumer.
          # Jobs: 117417603566: setup;117533117658: passing command/crate step.
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, family: windows-c, minutes: 17, job_minutes: 22, consumer_minutes: 16}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, family: windows-command, minutes: 17, job_minutes: 22, consumer_minutes: 16}
    defaults: {run: {shell: bash}}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_minutes }}
    permissions: {contents: read, actions: read}
    env: {MACOSX_DEPLOYMENT_TARGET: '15.0'}
    steps:
      - name: Keep Windows line endings as committed
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - name: Isolate Windows default folders
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          name: duckdb-hosts-${{ needs.resolve.outputs.version }}-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}
          path: duckdb-hosts
      - name: Restore the built DuckDB hosts
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow duckdb-host-unpack duckdb-hosts "$TARGET" "$SHA"
      - env: {TARGET: "${{ matrix.target }}", RELEASE_SMOKE: '1'}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow host-setup "$TARGET"
      - name: Read the JVM runtime floor
        id: jvm-contract
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {distribution: temurin, java-version: "${{ steps.jvm-contract.outputs.jdk }}"}
      - name: Select installed language tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          python3 sdlc/scripts/release-language-tools.py smoke "$RUNNER_TEMP/thinkthen-language-smoke" "$SHA" --acquire
      - name: Check and install pinned Go/C++ consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow go-cpp-tools "$TARGET" "$RUNNER_TEMP/thinkthen-go"
      - name: Check and install pinned Swift/Zig consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow swift-zig-tools "$TARGET" "$RUNNER_TEMP/thinkthen-zig"
      - name: Check and install pinned PHP/Dart consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow php-dart-tools "$TARGET" "$RUNNER_TEMP/thinkthen-dart"
      - name: Check Ada, GNU Objective-C and COBOL consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow ada-objc-cobol-tools "$TARGET"
      - name: Check selected managed consumer tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow managed-tools "$TARGET"
      - name: Select x64 MSVC
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: 'platform-${{ matrix.target }}', path: platform}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'macOS'
        with: {name: 'apple-packages-${{ matrix.target }}', path: platform}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'macOS'
        with: {name: 'apple-framework-${{ matrix.target }}', path: libraries/swift/CThinkThen.xcframework}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {name: provenance-x86, path: provenance}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: crate-package, path: crate-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with: {name: r-package, path: r-dist}
      - name: Check every prepared installed smoke input
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          python3 sdlc/scripts/hosted-preflight.py smoke "$TARGET"
      - name: Require the selected Go/C++ family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow go-cpp-gate platform "$TARGET" "$SHA"
      - name: Require the selected Swift/Zig family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow swift-zig-gate platform "$TARGET" "$SHA"
      - name: Require the selected PHP/Dart family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow php-dart-gate platform "$TARGET" "$SHA"
      - name: Require the selected Ada/Objective-C/COBOL family
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow ada-objc-cobol-gate platform "$TARGET" "$SHA"
      - name: Require the selected managed family and original receipts
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env: {TARGET: "${{ matrix.target }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow managed-gate platform "$TARGET" "$SHA" provenance
      - env: {THINKTHEN_RELEASE_SMOKE_FAMILY: '${{ matrix.family }}', THINKTHEN_TEST_PROFILE: full, TARGET: "${{ matrix.target }}", THINKTHEN_HEAVY_LOCK: "${{ runner.temp }}/thinkthen-release-smoke.lock"}
        if: matrix.target != 'x86_64-pc-windows-msvc' && matrix.family != 'examples' && matrix.family != 'installers'
        timeout-minutes: ${{ matrix.consumer_minutes }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow smoke-bundle platform npm-dist smoke-files
          sdlc/scripts/release-smoke smoke-files
          if [ "$THINKTHEN_RELEASE_SMOKE_FAMILY" = command ]; then
            sdlc/scripts/release-workflow crate-smoke crate-dist smoke-files
          fi
      - name: Qualify the installers
        if: matrix.family == 'installers'
        timeout-minutes: ${{ matrix.consumer_minutes }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow smoke-bundle platform npm-dist smoke-files
          sdlc/scripts/installer-test
          sdlc/scripts/release-workflow installer-smoke smoke-files
      - name: Replay public package examples on the prepared host
        timeout-minutes: ${{ matrix.consumer_minutes }}
        if: matrix.family == 'examples'
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          sdlc/scripts/release-workflow smoke-bundle platform npm-dist smoke-files
          cp crate-dist/*.crate smoke-files/
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then cp r-dist/* smoke-files/; fi
          sdlc/scripts/release-workflow public-examples "$TARGET" smoke-files
      - name: Validate and consume the downloaded Windows C archive
        timeout-minutes: ${{ matrix.consumer_minutes }}
        if: matrix.family == 'windows-c'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          python3 sdlc/scripts/release-windows-c.py check "platform/thinkthen-c-$version-x86_64-pc-windows-msvc.zip"
          python3 sdlc/scripts/release-windows-c-smoke.py "platform/thinkthen-c-$version-x86_64-pc-windows-msvc.zip"
      - name: Prove the Windows installer and smoke the command and packed Rust crate
        timeout-minutes: ${{ matrix.consumer_minutes }}
        if: matrix.family == 'windows-command'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/release-smoke.log") 2>&1
          python3 sdlc/scripts/release-windows-smoke.py platform --crate-dir crate-dist
      - name: Retain available smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-logs-${{ matrix.target }}-${{ matrix.family }}
          path: ${{ runner.temp }}/release-smoke.log
          if-no-files-found: warn
          retention-days: 7

  draft:
    needs: [resolve, smoke, registries, windows-sdks]
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: provenance-x86, path: provenance}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: apple-packages-aarch64-apple-darwin, path: platform/platform-aarch64-apple-darwin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: apple-packages-x86_64-apple-darwin, path: platform/platform-x86_64-apple-darwin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: r-package, path: r-dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: crate-package, path: crate-dist}
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/draft.log") 2>&1
          sdlc/scripts/release-workflow tap-formula "$VERSION" platform thinkthen.rb
      - timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/draft.log") 2>&1
          ruby -c thinkthen.rb
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          NAME: ${{ needs.resolve.outputs.name }}
          SHA: ${{ needs.resolve.outputs.sha }}
        timeout-minutes: 355
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/draft.log") 2>&1
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            # Stage 2 bindings and Unix-only families have no Windows release.
            [ "$target" != x86_64-pc-windows-msvc ] || continue
            sdlc/scripts/release-workflow go-cpp-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow swift-zig-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow php-dart-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow ada-objc-cobol-gate "platform/platform-$target" "$target" "$SHA"
            sdlc/scripts/release-workflow managed-gate "platform/platform-$target" "$target" "$SHA" provenance
          done
          sdlc/scripts/release-workflow collect platform npm-dist all-files
          cp r-dist/* crate-dist/*.crate all-files/
          sdlc/scripts/release-workflow draft "$MODE" "$NAME" "$SHA" all-files
      # Available logs survive a step timeout; runner/setup or whole-job
      # cancellation can still prevent this upload.
      - name: Retain available long-job logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-logs
          path: ${{ runner.temp }}/draft.log
          if-no-files-found: warn
          retention-days: 7

  crates:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: rust-lang/crates-io-auth-action@63a7064947ceca9989005e118db3a5fecdc9259f # v1.0.0
        id: auth
      - env: {CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"}
        run: cargo publish --locked --package thinkthen

  pypi:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - run: |
          mkdir dist
          cp platform/*/thinkthen-*.whl dist/
          [ "$(find dist -name '*.whl' | wc -l)" -eq 5 ]
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  npm:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: npm-package, path: npm-dist}
      # A leading ./ makes npm read a file; npm-dist/x.tgz reads as a GitHub repository.
      - env: {VERSION: "${{ needs.resolve.outputs.version }}"}
        run: |
          npm install --global npm@11.15.0
          npm stage publish "./npm-dist/thinkthen-$VERSION.tgz" --provenance --access public

  rubygems:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with: {ruby-version: '3.4.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0
      - run: |
          [ "$(gem --version)" = 3.6.9 ]
          [ "$(find platform -name 'thinkthen-*.gem' | wc -l)" -eq 5 ]
          for gem in platform/*/thinkthen-*.gem; do gem push "$gem"; done

  tap:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: read, actions: read}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'platform-*', path: platform}
      - env: {TAP_DEPLOY_KEY: "${{ secrets.TAP_DEPLOY_KEY }}", VERSION: "${{ needs.resolve.outputs.version }}"}
        run: sdlc/scripts/release-workflow tap "$VERSION" platform

  nuget:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      # Trusted publishing: the run's OIDC token buys a one-hour key, so the login sits just before the push.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with: {user: "${{ vars.NUGET_USER }}"}
      - env: {NUGET_API_KEY: "${{ steps.login.outputs.NUGET_API_KEY }}"}
        run: sdlc/scripts/release-workflow nuget-push registry/nuget/Botassembly.ThinkThen.*.nupkg

  maven:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: read, actions: read}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      - env:
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: sdlc/scripts/release-workflow maven-sign registry/maven release "$RUNNER_TEMP/maven-bundle.zip"
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: sdlc/scripts/release-workflow maven-upload "$RUNNER_TEMP/maven-bundle.zip"

  pub:
    needs: [resolve, draft]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: registry-packages, path: registry}
      # pub.dev trusted publishing: setup-dart turns the run's OIDC token into the pub.dev token.
      # pub.dev accepts this workflow_dispatch run because it runs on the v* tag ref.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: '3.13.4'}
      - run: sdlc/scripts/release-workflow pub-publish registry/pub/thinkthen_dart

  publish:
    needs: [resolve, draft, crates, pypi, npm, rubygems, tap, nuget, maven, pub]
    if: inputs.mode == 'release'
    environment: release
    runs-on: ubuntu-24.04
    # No applicable current passing duration in the bounded release history.
    # Retain the existing cap; measure at the next authorized checkpoint.
    timeout-minutes: 360
    permissions: {contents: write, actions: write}
    steps:
      - env: {RELEASE_ARMED: "${{ vars.RELEASE_ARMED }}"}
        run: '[ "$RELEASE_ARMED" = true ]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ needs.resolve.outputs.sha }}", persist-credentials: false}
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", NAME: "${{ needs.resolve.outputs.name }}", SHA: "${{ needs.resolve.outputs.sha }}"}
        run: sdlc/scripts/release-workflow publish "$NAME" "$SHA"
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", NAME: "${{ needs.resolve.outputs.name }}", VERSION: "${{ needs.resolve.outputs.version }}"}
        run: gh workflow run install-check.yml --ref "$NAME" -f version="$VERSION"
