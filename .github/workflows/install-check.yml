name: native qualification proof

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate version to qualify without publication
        required: true
        default: v0.2.0
        type: string

permissions: {contents: read}

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.resolve.outputs.sha }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - name: Exercise release source refusals
        run: scripts/qualification-source-check
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: scripts/release-workflow resolve "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  qualification:
    needs: candidate
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ needs.candidate.outputs.revision }}
      matrix: ${{ needs.candidate.outputs.matrix }}
