# The gate ladder, run only by hand from the Actions tab.
#
# Ian ruled on 2026-09-22 that no push or pull request starts this workflow.
# The local sdlc/scripts ladder is the gate of record. The ruling is in
# sdlc/issues/closed/2026-09-22-stop-github-actions-on-push.md.
#
# No step here holds a secret or reads a provider key. A
# live call to the paid backend never happens here. A live run is a job done by
# hand through sdlc/scripts/live, under a token cap, with Ian's authorization.
#
# Every action is pinned to a commit SHA, because a tag moves and a moved tag
# runs code nobody reviewed. The tag each SHA carried is in the comment beside
# it. The SHAs were read with `git ls-remote` on 2026-09-19. The jq binary is
# checked against the SHA-256 the jq project publishes beside the release.

name: gate
run-name: gate ${{ inputs.language || 'none' }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      language:
        description: Installed package to check; none runs the existing gate ladder
        type: choice
        required: false
        default: none
        options: [none, go, cpp, postgresql, ruby, linux-release, release-qa]
      candidate_sha:
        description: Exact reviewed commit for linux-release or release-qa
        type: string
        required: false
      candidate_tag:
        description: Candidate tag for linux-release receipts or release-qa
        type: string
        required: false
      apple_run:
        description: Same-commit release rehearsal run containing Apple coverage or QA archives
        type: string
        required: false
      platform:
        description: Standard hosted runner for the selected installed package
        type: choice
        required: false
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]

permissions:
  contents: read

env:
  # The checker rung 1 runs. sdlc/scripts/install names the same version.
  DENY_VERSION: 0.19.4
  JQ_VERSION: jq-1.7.1
  # From sha256sum.txt in the jq-1.7.1 release, checked against the file
  # downloaded from the same release on 2026-09-19.
  JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
  MUSTMATCH_VERSION: 0.1.0

jobs:
  ladder:
    if: inputs.language == '' || inputs.language == 'none'
    name: install, lint, test, spec
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the toolchain that rust-toolchain.toml pins
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache the cargo registry and the build directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            ~/.cargo/advisory-dbs
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-deny-${{ env.DENY_VERSION }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install jq and mustmatch at pinned versions
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          . sdlc/scripts/fetch.sh
          fetch_url "$HOME/.local/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$HOME/.local/bin/jq" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/jq"
          pipx install "mustmatch==$MUSTMATCH_VERSION"

      - name: Install cargo-deny at the pinned version
        run: |
          set -eu
          if [ "$(cargo deny --version 2>/dev/null || true)" != "cargo-deny $DENY_VERSION" ]; then
            cargo install --locked --force "cargo-deny@$DENY_VERSION"
          fi

      # The install rung requires these and never installs them. The pins come from sdlc/scripts/install.
      - name: Install the external C header generator
        run: |
          set -eu
          version=$(python3 -c 'import runpy; print(runpy.run_path("sdlc/scripts/generate-c-header.py")["VERSION"].split()[1])')
          if [ "$(cbindgen --version 2>/dev/null || true)" != "cbindgen $version" ]; then
            cargo install --locked --force "cbindgen@$version"
          fi

      - name: Install cargo-public-api, its nightly, and PyYAML at the rung's pins
        run: |
          set -eu
          pin() { sed -n "s/^$1=//p" sdlc/scripts/install; }
          rustup toolchain install "$(pin PUBLIC_API_TOOLCHAIN)" --profile minimal
          if [ "$(cargo public-api --version 2>/dev/null || true)" != "cargo-public-api $(pin PUBLIC_API_VERSION)" ]; then
            cargo install --locked --force "cargo-public-api@$(pin PUBLIC_API_VERSION)"
          fi
          python3 -m pip install --user --break-system-packages "PyYAML==$(pin PYYAML_VERSION)"

      - name: Rung 0, install
        run: sdlc/scripts/install

      - name: Rung 1, lint
        run: sdlc/scripts/lint

      - name: Rung 2, test
        run: sdlc/scripts/test

      - name: Rung 3, spec
        run: sdlc/scripts/spec

  language:
    name: Installed ${{ inputs.language }} package on ${{ inputs.platform || 'ubuntu-24.04' }}
    if: inputs.language != '' && inputs.language != 'none' && inputs.language != 'linux-release' && inputs.language != 'release-qa'
    runs-on: ${{ inputs.platform || 'ubuntu-24.04' }}
    defaults: {run: {shell: bash}}
    env:
      LANGUAGE: ${{ inputs.language }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      THINKTHEN_TEST_PROFILE: routine
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Require a named language and the dispatched branch commit
        env: {REF: "${{ github.ref }}", SHA: "${{ github.sha }}"}
        run: |
          set -eu
          case "$LANGUAGE" in go|cpp|postgresql|ruby) ;; *) exit 2 ;; esac
          case "$REF" in refs/heads/*) ;; *) exit 2 ;; esac
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          echo "Checking $LANGUAGE at $SHA"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - name: Install the repository's pinned Rust toolchain and test dependencies
        run: |
          set -eu
          rustup show active-toolchain || rustup toolchain install
          python3 -m pip install 'jsonschema==4.25.1'
          cargo fetch --locked --manifest-path libraries/c/Cargo.toml
          cargo fetch --locked
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/thinkthen-language-target" >> "$GITHUB_ENV"
      - name: Check C++ source
        if: inputs.language == 'cpp'
        run: |
          set -eu
          (cd libraries/cpp && node ../../sdlc/scripts/ratchet.mjs ratchet.hpp.json)
          python3 sdlc/generators/results/generate.py --target cpp --check
          python3 sdlc/generators/results/generate.py --target cpp --inputs --check
      - name: Prepare the pinned PostgreSQL hosts
        if: inputs.language == 'postgresql'
        run: |
          set -eu
          if [ "$(uname -s)" = Darwin ]; then
            brew install bash
          else
            sudo apt-get update -qq
            sudo apt-get install -y libclang-dev postgresql-server-dev-16
          fi
          cargo install --locked --no-default-features --version 0.17.0 cargo-pgrx
          cargo fetch --locked --manifest-path databases/postgresql/Cargo.toml
          mkdir -p "$HOME/.pgrx"
          printf '[configs]\n' >"$HOME/.pgrx/config.toml"
          for major in 16 17 18; do
            sh databases/postgresql/setup.sh "$major"
            config=$(cd databases/postgresql && PG_MAJOR=$major bash -c '. ../../sdlc/scripts/scratch.sh; . ./runtime.sh; runtime_ready; printf "%s" "$PG_CONFIG"')
            printf 'pg%s = "%s"\n' "$major" "$config" >>"$HOME/.pgrx/config.toml"
          done
      - name: Check each PostgreSQL major and its installed archive
        if: inputs.language == 'postgresql'
        run: |
          set -eu
          target=$(rustc -vV | sed -n 's/^host: //p')
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          out="$RUNNER_TEMP/thinkthen-language-packages"
          failed=0
          for major in 16 17 18; do
            python3 sdlc/scripts/build-admission.py -- bash databases/postgresql/check.sh "$major" || failed=1
          done
          THINKTHEN_TEST_PROFILE=full CARGO_NET_OFFLINE=true sdlc/scripts/release-pack --reuse "$target" "$out" postgresql
          for major in 16 17 18; do
            THINKTHEN_ARTIFACT="$out/thinkthen-postgresql$major-$version-$target.tar.gz" \
              python3 sdlc/scripts/build-admission.py -- bash databases/postgresql/check.sh "$major" || failed=1
          done
          [ "$failed" -eq 0 ]
      - name: Prepare both pinned Ruby toolchains
        if: inputs.language == 'ruby'
        run: |
          set -eu
          if [ "$(uname -s)" = Darwin ]; then
            . libraries/ruby/toolchain.env
            brew install "openssl@$RUBY_OPENSSL_SERIES"
            printf 'MACOSX_DEPLOYMENT_TARGET=%s\n' "$RUBY_MACOS_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
            printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
            clang=$(xcrun --find clang)
            clang=${clang%/bin/clang}/lib
          else
            sudo apt-get update -qq
            sudo apt-get install -y libclang-dev libssl-dev
            clang=$(for lib in /usr/lib/llvm-*/lib; do [ -e "$lib/libclang.so.1" ] && echo "$lib"; done | sort -V | tail -n 1)
          fi
          printf 'LIBCLANG_PATH=%s\n' "$clang" >> "$GITHUB_ENV"
          cargo install --locked "cargo-deny@$DENY_VERSION"
          cargo deny fetch db
          cargo fetch --locked --manifest-path libraries/ruby/Cargo.toml
          sh libraries/ruby/setup-ruby.sh
          cargo build --locked --offline -p conformance-backend
      - name: Pack and check the Ruby gem on both runtimes
        if: inputs.language == 'ruby'
        run: |
          set -eu
          target=$(rustc -vV | sed -n 's/^host: //p')
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          out="$RUNNER_TEMP/thinkthen-language-packages"
          CARGO_NET_OFFLINE=true sdlc/scripts/release-pack "$target" "$out" ruby
          artifact=$(find "$out" -maxdepth 1 -name "thinkthen-$version-*.gem")
          . libraries/ruby/toolchain.env
          failed=0
          for minor in $RUBY_MINORS; do
            echo "Check installed Ruby $minor"
            THINKTHEN_ARTIFACT="$artifact" THINKTHEN_RUBY_MINOR=$minor sh libraries/ruby/check.sh || failed=1
            THINKTHEN_RUBY_MINOR=$minor
            . libraries/ruby/toolchain.env
            prefix=${THINKTHEN_TOOLCHAINS:-$HOME/.cache/thinkthen-toolchains}/ruby/$RUBY_VERSION
            [ "$(uname -s)" != Darwin ] || prefix=$prefix-$(uname -m)-darwin
            "$prefix/bin/ruby" libraries/ruby/tests/test_package.rb || failed=1
          done
          exit "$failed"
      - name: Pack and check only the selected installed language
        if: inputs.language != 'postgresql' && inputs.language != 'ruby'
        run: |
          set -eu
          target=$(rustc -vV | sed -n 's/^host: //p')
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/thinkthen/Cargo.toml | head -n 1)
          out="$RUNNER_TEMP/thinkthen-language-packages"
          CARGO_NET_OFFLINE=true sdlc/scripts/release-pack "$target" "$out" c "$LANGUAGE"
          export THINKTHEN_ARTIFACT="$out/thinkthen-$LANGUAGE-$version-$target.tar.gz"
          export THINKTHEN_C_ARTIFACT="$out/thinkthen-c-$version-$target.tar.gz"
          sh "libraries/$LANGUAGE/check.sh"

  linux-release:
    name: Linux release ${{ matrix.stage }}
    if: inputs.language == 'linux-release'
    runs-on: ubuntu-24.04
    defaults: {run: {shell: bash}}
    strategy:
      fail-fast: false
      matrix: {stage: [core, functional]}
    env: &linux-release-env
      SHA: ${{ inputs.candidate_sha }}
      TAG: ${{ inputs.candidate_tag }}
      STAGE: ${{ matrix.stage }}
      TARGET: x86_64-unknown-linux-gnu
      RELEASE_SMOKE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps: &linux-release-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Require the frozen dispatch commit and candidate
        env: {DISPATCH_SHA: '${{ github.sha }}'}
        run: |
          set -eu
          python3 sdlc/scripts/hosted-candidate.py checkout "$SHA" "$DISPATCH_SHA"
          [[ "$TAG" =~ ^rc/0\.2\.0-rc\.[1-9][0-9]*$ ]]
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          fi
          work=$(sdlc/scripts/release-workflow linux-work "$RUNNER_TEMP/thinkthen-linux-release")
          mkdir -p "$work/$STAGE/evidence" "$work/$STAGE/home" "$work/$STAGE/target"
          ln -s "$work/$STAGE/target" target
          printf 'GATE_OUTPUT=%s\n' "$work/$STAGE/evidence" >> "$GITHUB_ENV"
          printf 'RELEASE_WORK=%s\n' "$work/$STAGE" >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s\nUV_PYTHON_INSTALL_DIR=%s\n' "$work/$STAGE/uv-cache" "$work/$STAGE/uv-python" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME/.local/bin" "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.22.3'}
      - name: Read the JVM floor from its contract
        id: jvm-contract
        run: echo "jdk=$(python3 sdlc/scripts/package-inventory.py jvm --field jdk)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '${{ steps.jvm-contract.outputs.jdk }}'}
      - name: Install existing pinned Linux host and consumer tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev libssl-dev musl-tools php8.3-cli php8.3-common composer \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb xauth
          sdlc/scripts/release-workflow host-setup "$TARGET"
          python3 sdlc/scripts/release-language-tools.py smoke "$RELEASE_WORK/language-tools" "$SHA" --acquire
          cargo install --locked --no-default-features --version 0.17.0 cargo-pgrx
          cargo install --locked cargo-nextest
          pin() { sed -n "s/^$1=//p" sdlc/scripts/install; }
          rustup toolchain install "$(pin PUBLIC_API_TOOLCHAIN)" --profile minimal
          rustup component add llvm-tools-preview
          cargo install --locked "cargo-public-api@$(pin PUBLIC_API_VERSION)"
          version=$(python3 -c 'import runpy; print(runpy.run_path("sdlc/scripts/generate-c-header.py")["VERSION"].split()[1])')
          cargo install --locked "cbindgen@$version"
          python3 -m pip install "PyYAML==$(pin PYYAML_VERSION)"
          pipx install "mustmatch==$MUSTMATCH_VERSION"
          command -v mustmatch
          . sdlc/scripts/fetch.sh
          fetch_url "$HOME/.local/bin/jq" "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$HOME/.local/bin/jq" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/jq"
          for manifest in conformance/consumer/Cargo.toml libraries/rust/Cargo.toml \
            libraries/rust/consumer/Cargo.toml libraries/r/thinkthen/src/rust/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done
          mkdir -p "$RELEASE_WORK/typescript"
          cp libraries/typescript/package.json libraries/typescript/package-lock.json "$RELEASE_WORK/typescript/"
          npm ci --no-audit --no-fund --prefix "$RELEASE_WORK/typescript"
          printf '%s\n' "$RELEASE_WORK/typescript/node_modules/.bin" >> "$GITHUB_PATH"
          uv venv "$RELEASE_WORK/python"
          uv pip install --require-hashes --python "$RELEASE_WORK/python/bin/python" -r libraries/python/requirements-dev.txt
          . libraries/ruby/toolchain.env
          printf 'RUBY=%s\nRBCONFIG=%s\n' \
            "$HOME/.cache/thinkthen-toolchains/ruby/$RUBY_VERSION/bin/ruby" \
            "$HOME/.cache/thinkthen-toolchains/ruby/$RUBY_VERSION/lib/ruby/${RUBY_VERSION%.*}.0/x86_64-linux/rbconfig.rb" >> "$GITHUB_ENV"
          clang=$(for lib in /usr/lib/llvm-*/lib; do [ ! -e "$lib/libclang.so.1" ] || echo "$lib"; done | sort -V | tail -n 1)
          test -n "$clang"
          printf 'LIBCLANG_PATH=%s\n' "$clang" >> "$GITHUB_ENV"
          printf 'R_LIBS_USER=%s\n' "$HOME/.cache/thinkthen-toolchains/r-library" >> "$GITHUB_ENV"
      - name: Select existing Go, Swift, Zig, PHP, Dart and native language tools
        run: |
          set -eu
          sdlc/scripts/release-workflow go-cpp-tools "$TARGET" "$RELEASE_WORK/go"
          sdlc/scripts/release-workflow swift-zig-tools "$TARGET" "$RELEASE_WORK/zig"
          sdlc/scripts/release-workflow php-dart-tools "$TARGET" "$RELEASE_WORK/dart"
          sdlc/scripts/release-workflow ada-objc-cobol-tools "$TARGET"
          sdlc/scripts/release-workflow managed-tools "$TARGET"
      - name: Acquire Flutter from its pinned official source commit
        run: |
          set -eu
          mkdir -p "$HOME/.local/opt/flutter"
          git -C "$HOME/.local/opt/flutter" init
          git -C "$HOME/.local/opt/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$HOME/.local/opt/flutter" fetch --depth=1 origin 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          git -C "$HOME/.local/opt/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$HOME/.local/opt/flutter" rev-parse HEAD)" = 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          flutter="$HOME/.local/opt/flutter/bin/flutter"
          dart="$HOME/.local/opt/flutter/bin/cache/dart-sdk/bin/dart"
          export PUB_CACHE="$RELEASE_WORK/dart/pub-cache"
          "$flutter" config --no-analytics --enable-linux-desktop
          "$flutter" precache --linux
          "$dart" --version 2>&1 | grep -F 'Dart SDK version: 3.13.4 (stable)'
          # Seed the SDK and every frozen consumer lock before offline gates.
          (cd "$HOME/.local/opt/flutter/packages/flutter_tools" && "$dart" pub get --enforce-lockfile)
          for project in libraries/dart libraries/dart/flutter libraries/dart/flutter/example; do
            (cd "$project" && "$flutter" pub get --enforce-lockfile)
          done
          git diff --exit-code
          printf 'TT_DART=%s\nTT_FLUTTER=%s\n' "$dart" "$flutter" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME/.local/opt/flutter/bin" >> "$GITHUB_PATH"
          git -C "$HOME/.local/opt/flutter" rev-parse HEAD > "$GATE_OUTPUT/flutter-source.txt"
      - name: Report hosted disk before the selected stage
        run: sdlc/scripts/release-workflow disk "$STAGE start" "$RELEASE_WORK" "$HOME/.cargo" "$HOME/.rustup" "$HOME/.cache/thinkthen-toolchains" target
      - name: Download the same-SHA Apple coverage report
        if: matrix.stage == 'coverage'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-coverage-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/thinkthen-apple-coverage
          run-id: ${{ inputs.apple_run }}
          github-token: ${{ github.token }}
      - name: Run the selected existing gates and retain their actual exits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, importlib.util, json, os, shutil, signal, subprocess, time
          from conformance.children.children import child_env
          root = Path.cwd()
          out = Path(os.environ['GATE_OUTPUT'])
          work = Path(os.environ['RELEASE_WORK'])
          sha, tag, stage = (os.environ[key] for key in ('SHA', 'TAG', 'STAGE'))
          spec = importlib.util.spec_from_file_location('admission', root / 'sdlc/scripts/build-admission.py')
          admission = importlib.util.module_from_spec(spec); spec.loader.exec_module(admission)
          for signum in (signal.SIGTERM, signal.SIGINT, signal.SIGHUP):
              signal.signal(signum, admission.interrupted)
          env = child_env(('LANG', 'LC_ALL', 'USER', 'LOGNAME', 'SHELL', 'TMPDIR', 'CARGO_HOME', 'RUSTUP_HOME',
                           'LIBCLANG_PATH', 'PUB_CACHE', 'RUBY', 'RBCONFIG', 'R_LIBS_USER', 'JAVA_HOME',
                           'UV_CACHE_DIR', 'UV_PYTHON_INSTALL_DIR'), home=work / 'home')
          for key in ('THINKTHEN_DOTNET', 'THINKTHEN_JDK_HOME', 'THINKTHEN_KOTLIN_HOME', 'THINKTHEN_SCALA_HOME',
                      'TT_DART', 'TT_FLUTTER', 'THINKTHEN_PHP_BIN'):
              env[key] = os.environ[key]
          env.update(CARGO_HOME=os.environ.get('CARGO_HOME', str(Path.home() / '.cargo')),
                     RUSTUP_HOME=os.environ.get('RUSTUP_HOME', str(Path.home() / '.rustup')),
                     CARGO_TARGET_DIR=str(root / 'target'), CARGO_NET_OFFLINE='true', CARGO_BUILD_JOBS='2',
                     CARGO_PROFILE_DEV_DEBUG='0', CARGO_PROFILE_TEST_DEBUG='0', CARGO_INCREMENTAL='0',
                     THINKTHEN_SESSION_JDK_HOME=env['THINKTHEN_JDK_HOME'],
                     THINKTHEN_TOOLCHAINS=str(Path.home() / '.cache/thinkthen-toolchains'),
                     R_LIBS=env['R_LIBS_USER'], PYTHON_HOST=str(work / 'python/bin/python'),
                     GOPROXY='off', GOSUMDB='off', GOTOOLCHAIN='local', CI='true',
                     DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER='1', MSBUILDDISABLENODEREUSE='1',
                     FLUTTER_SUPPRESS_ANALYTICS='true', THINKTHEN_MACOS_APPLE_CHECKS='required')
          env['PATH'] = str(Path(env['THINKTHEN_DOTNET']).parent) + os.pathsep + env['PATH']
          for key in ('HOME', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME', 'XDG_STATE_HOME'):
              Path(env[key]).mkdir(parents=True, exist_ok=True)
          (Path(env['HOME']) / '.cache').mkdir(exist_ok=True)
          (Path(env['HOME']) / '.cache/thinkthen-toolchains').symlink_to(env['THINKTHEN_TOOLCHAINS'])
          (out / 'environment.json').write_text(json.dumps(env, indent=2) + '\n')
          (out / 'OWNER').write_text('Linux release ' + stage + '\nRevision: ' + sha + '\n')
          result = ({'revision': sha, 'state': 'running', 'gates': {}} if stage == 'core' else
                    {'sha': sha, 'tag': tag, 'kind': 'local', 'state': 'running', 'phases': {}, 'exit': None})
          def save():
              path = out / ('results-final-core.json' if stage == 'core' else 'result.json')
              path.write_text(json.dumps(result, indent=2) + '\n')
          def snapshot(name):
              value = Path('/proc/pressure/io').read_text()
              (out / name).write_text(value)
              return {line.split()[0]: dict(part.split('=') for part in line.split()[1:]) for line in value.splitlines()}
          def run(name, command, cwd=root, extra=None):
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip() == sha
              assert subprocess.call(['git', 'diff', '--quiet', 'HEAD', '--'], cwd=root) == 0
              started = time.time(); before = snapshot(name + '.io-before')
              with (out / (name + '.log')).open('wb') as log:
                  saved = os.dup(1), os.dup(2); previous = Path.cwd()
                  try:
                      os.dup2(log.fileno(), 1); os.dup2(log.fileno(), 2); os.chdir(cwd)
                      code = admission.run_owned(command, dict(env, **(extra or {})), None)
                  finally:
                      os.chdir(previous); os.dup2(saved[0], 1); os.dup2(saved[1], 2)
                      os.close(saved[0]); os.close(saved[1]); signal.pthread_sigmask(signal.SIG_SETMASK, set())
              remaining = sorted(admission.child_pids())
              after = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
              clean = subprocess.call(['git', 'diff', '--quiet', 'HEAD', '--'], cwd=root) == 0
              guard = None if after == sha and clean and not remaining else 'source identity, tracked source or child ownership changed'
              receipt = ({'revision': sha, 'command': command, 'cwd': str(cwd), 'exit': code,
                          'seconds': round(time.time() - started, 2), 'remaining_children': remaining,
                          'io_before': before, 'io_after': snapshot(name + '.io-after')} if stage == 'core' else
                         {'sha': sha, 'tag': tag, 'command': command, 'started': started, 'finished': time.time(),
                          'state': 'completed', 'command_exit': code, 'exit': code if guard is None else 1,
                          'guard_error': guard, 'remaining_children': remaining})
              result['gates' if stage == 'core' else 'phases'][name] = receipt
              (out / (name + '.json')).write_text(json.dumps(receipt, indent=2) + '\n'); save()
              print(name, 'exit', code, flush=True)
              if guard or (code != 0 and (name, code) != ('objective-c-platform', 77)):
                  raise RuntimeError(name + ' failed: ' + str(code))
              return code
          save()
