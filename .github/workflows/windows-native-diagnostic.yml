# One offline Rust cancellation scenario on the standard Windows runner.
name: windows-native-diagnostic

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to diagnose
        type: string
        required: true
      scenario:
        description: Fixed diagnostic scenario
        type: choice
        default: recognition-cancel
        options: [recognition-cancel]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  recognition-cancel:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '4'
      PYTHONUTF8: '1'
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require the exact candidate commit
        id: candidate
        env: {CANDIDATE_SHA: "${{ inputs.candidate_sha }}", DISPATCH_SHA: "${{ github.sha }}"}
        run: python3 sdlc/scripts/hosted-candidate.py checkout "$CANDIDATE_SHA" "$DISPATCH_SHA"
      - name: Require the fixed scenario
        env: {SCENARIO: "${{ inputs.scenario }}"}
        run: test "$SCENARIO" = recognition-cancel
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore the existing Windows cargo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            libraries/c/target
          key: windows-${{ hashFiles('Cargo.lock', 'libraries/c/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-
      - name: Isolate default folders
        run: |
          set -eu
          printf 'APPDATA=%s\\thinkthen-appdata\\Roaming\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LOCALAPPDATA=%s\\thinkthen-appdata\\Local\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/thinkthen-appdata/Roaming" "$RUNNER_TEMP/thinkthen-appdata/Local"
      - name: Select x64 MSVC
        run: python3 sdlc/scripts/release-msvc.py >> "$GITHUB_ENV"
      - name: Download locked crates
        run: cargo fetch --locked
      - name: Diagnose recognition cancellation once
        run: cargo test --locked --offline -p thinkthen --test request_session recognize::cancellation_stops_waiting_duplicate_recognition_without_extra_sends -- --exact --nocapture
