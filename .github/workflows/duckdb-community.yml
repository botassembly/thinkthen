name: DuckDB community build
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.pins.outputs.release }}
      release_tools: ${{ steps.pins.outputs.release_tools }}
      preview_source: ${{ steps.pins.outputs.preview_source }}
      preview_tools: ${{ steps.pins.outputs.preview_tools }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: pins
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'databases/duckdb/tools')
          from inputs import authority
          values = authority()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('RELEASE', 'RELEASE_TOOLS', 'PREVIEW_SOURCE', 'PREVIEW_TOOLS'):
                  print(name.lower() + '=' + values['DUCKDB_ROUTINE_' + name], file=output)
          PYCODE
  release:
    needs: inputs
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@3fd6109fc01555673b7c7123eba8d0d143fe8ce4
    with:
      extension_name: thinkthen
      duckdb_version: ${{ needs.inputs.outputs.release }}
      ci_tools_version: ${{ needs.inputs.outputs.release_tools }}
      override_repository: ${{ github.repository }}
      override_ref: ${{ github.sha }}
      exclude_archs: windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads
      extra_toolchains: rust
      reduced_ci_mode: disabled
      save_cache: false
  preview:
    needs: [inputs, release]
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a68570fde10384547868301a12327d5c67909527
    with:
      extension_name: thinkthen
      duckdb_version: ${{ needs.inputs.outputs.preview_source }}
      ci_tools_version: ${{ needs.inputs.outputs.preview_tools }}
      override_repository: ${{ github.repository }}
      override_ref: ${{ github.sha }}
      exclude_archs: windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads
      extra_toolchains: rust
      reduced_ci_mode: disabled
      save_cache: false
  doc_test:
    needs: [inputs, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: duckdb/community-extensions
          ref: 14b1f68c427b51cd00edbc3f25ee55ad8c7eaaac
          path: community
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: thinkthen-${{ needs.inputs.outputs.release }}-extension-linux_amd64
          path: community/build/downloaded
      - name: Run the community documentation generator
        working-directory: community
        env:
          GH_TOKEN: ${{ github.token }}
          THINKTHEN_CANDIDATE: ${{ github.sha }}
          DUCKDB_RELEASE: ${{ needs.inputs.outputs.release }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m pip install --break-system-packages 'yq==3.4.3' 'PyYAML==6.0.3'
          curl --fail --location "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_RELEASE/duckdb_cli-linux-amd64.zip" -o duckdb.zip
          unzip duckdb.zip
          mkdir -p extensions/thinkthen
          sed "s/<reviewed-0.2-candidate-commit>/$THINKTHEN_CANDIDATE/g" ../source/sdlc/records/0577-description-draft.yml > extensions/thinkthen/description.yml
          ./duckdb -unsigned -c "SET extension_directory = 'build/extension_dir'; FORCE INSTALL 'build/downloaded/thinkthen.duckdb_extension';"
          ./scripts/generate_md.sh ./duckdb
          ./scripts/generate_extensions_json.py
          test -s build/docs/thinkthen.md
          python3 - <<'PYCODE'
          import sys, yaml
          from pathlib import Path
          sys.path[:0] = ['../source/databases/duckdb/tools', '../source/conformance/children']
          from backend import Backend
          from harness import FAKE_KEY, expect
          from source_hosts import cli_runner
          with open('extensions/thinkthen/description.yml') as source:
              sql = yaml.safe_load(source)['docs']['hello_world']
          backend = Backend(key=FAKE_KEY)
          try:
              run = cli_runner(Path('duckdb').resolve(),
                               Path('build/downloaded/thinkthen.duckdb_extension').resolve())
              got = run([statement for statement in sql.split(';') if statement.strip()],
                        f'http://127.0.0.1:{backend.server_port}/generic/v1')
              expect(got, [
                  {'rows': [['Please refund my order. It arrived broken.', True],
                            ['Thanks for the quick help yesterday!', True],
                            ['I want to send this back.', True]]},
                  {'rows': [['Please refund the extra fee on my invoice.', 'billing'],
                            ['My parcel went to the wrong address.', 'billing'],
                            ['I cannot reset my password.', 'billing']]},
              ], 'documentation SQL against the fixed loopback answers')
              expect(backend.attempts, 2, 'each documentation query packs its three records')
          finally:
              backend.close()
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thinkthen-community-docs
          path: community/build/docs
