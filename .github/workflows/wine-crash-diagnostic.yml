name: Retained Wine crash diagnostic

on:
  workflow_dispatch:

permissions: {contents: read, actions: read}
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  retained-find:
    if: github.repository == 'botassembly/thinkthen'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - name: Fetch the exact retained public artifact
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/botassembly/thinkthen/actions/artifacts/13729574040/zip > "$RUNNER_TEMP/retained-windows.zip"
      - name: Prepare the disposable Wine runtime
        timeout-minutes: 4
        run: |
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/wine-setup.txt"
          sudo apt-get install -y --no-install-recommends wine64 wine 2>&1 | tee -a "$RUNNER_TEMP/wine-setup.txt"
      - name: Capture the single retained find case
        timeout-minutes: 5
        run: python3 scripts/wine-crash-diagnostic "$RUNNER_TEMP/retained-windows.zip" "$RUNNER_TEMP/wine-diagnostic"
      - name: Preserve bounded identity and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retained-wine-diagnostic
          path: |
            ${{ runner.temp }}/wine-setup.txt
            ${{ runner.temp }}/wine-diagnostic/*.json
            ${{ runner.temp }}/wine-diagnostic/*.stdout
            ${{ runner.temp }}/wine-diagnostic/*.stderr
          if-no-files-found: error
          retention-days: 7
