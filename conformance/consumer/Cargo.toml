# The external consumer of the public Rust API, ticket 0086. It is its own
# workspace, so the crate is built the way an outside user builds it: by path,
# with default features off. `sdlc/scripts/policy.py` holds its lock to the
# root lock's versions and its lint tables to the root table.
[workspace]
members = ["consumer", "fork-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93.1"

[workspace.lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
