[package]
name = "fork-probe"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The one fork call behind the real-fork proofs of the thinkthen library"
license = "MIT"
publish = false

[dependencies]
libc = "0.2.189"
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
conformance-backend = { path = "../../backend" }
thinkthen = { path = "../../../crates/thinkthen", default-features = false }

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
