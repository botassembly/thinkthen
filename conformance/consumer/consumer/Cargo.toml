[package]
name = "consumer"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "An outside user of the thinkthen library, run by the test rung"
license = "MIT"
publish = false

[dependencies]
thinkthen = { path = "../../../crates/thinkthen", default-features = false, features = ["bundled-sqlite"] }

[dev-dependencies]
conformance-backend = { path = "../../backend" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
