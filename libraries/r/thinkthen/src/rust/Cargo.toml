# The R surface's Rust half (ticket 0108, ADR 0047). It is its own workspace
# with its own lock, and it reaches `thinkthen` only through the public API.
# `sdlc/scripts/policy.py` holds every table below to the root copies.
[workspace]

[package]
name = "thinkthen-r"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "The R package's extendr shim over the thinkthen public API"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]
name = "thinkthen_r"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
thinkthen = { path = "../../../../../crates/thinkthen", default-features = false }
extendr-api = "=0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
