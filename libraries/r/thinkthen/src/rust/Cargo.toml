[package]
name = 'thinkthen'
publish = false
version = '0.0.1'
edition = '2021'
rust-version = '1.80'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'thinkthen'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.8'
thinkthen-contract = { path = '../../../../../contract' }
thinkthen-standin = { path = '../../../../../standin' }

[features]
# Forward the stand-in's compile-time fixture door to a gate build that
# needs it (conformance case 74's synthesized partial failure). Off by
# default: a package installed without it carries no fixture code, and no
# environment variable can arm one.
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

[profile.release]
lto = true
codegen-units = 1

[workspace]
