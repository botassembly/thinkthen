# The Rust examples surface (ticket 0093, ADR 0047). It is its own workspace
# with its own lock, and it reaches `thinkthen` only through the public API.
# `sdlc/scripts/policy.py` holds every table below to the root copies.
[workspace]

[package]
name = "rust-examples"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "Runnable examples of every thinkthen function, from outside the crate"
license = "MIT"
publish = false

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false }

[dev-dependencies]
conformance-backend = { path = "../../conformance/backend" }

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
