[package]
name = "thinkthen"
version = "0.0.1"
edition = "2024"
rust-version = "1.93.1"
description = "The Rust surface: the engine itself, with no binding in between. Version 0.1.0 is the first release"
license = "MIT"
publish = false

# A workspace of its own, so the root workspace's gates and profile stay
# untouched.
[workspace]

[dependencies]
serde_json = "1"
thinkthen-contract = { version = "0.0.1", path = "../../contract" }
# The one dependency that changes when the real engine lands.
thinkthen-standin = { version = "0.0.1", path = "../../standin" }
# The Series door's own dependency, off by default. Polars requires the
# 1.95 toolchain (experiment 228: sysinfo 0.39 refuses 1.93); with the
# feature off this crate builds with the pinned 1.93.1 and no Polars.
polars = { version = "0.55.2", optional = true, default-features = false, features = ["lazy"] }

[features]
# A Polars column crosses zero-copy on Arrow buffers through the same
# engine, the same width gate, and the same batch spine as a slice.
polars = ["dep:polars"]
# Forward the stand-in's compile-time fixture door to a gate build that
# needs it (conformance case 74's synthesized partial failure). Off by
# default: a shipped library carries no fixture code and no environment
# variable can arm one.
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "forbid"
unreachable_pub = "forbid"
unsafe_code = "forbid"

[profile.release]
# A library lives inside someone else's process, and an abort there kills
# the host. The command's own profile stays as the root workspace sets it.
panic = "unwind"
