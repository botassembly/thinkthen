# The Rust Polars surface (ticket 0120, ADR 0047). It is its own workspace
# with its own lock, and it reaches `thinkthen` only through the public API.
# `sdlc/scripts/policy.py` holds every table below to the root copies, and it
# holds the `polars` and `polars-core` pins equal.
[workspace]

[package]
name = "thinkthen-polars"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "Ask thinkthen questions of a Polars Series or DataFrame"
license = "MIT"
publish = false

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false }
polars = { version = "=0.55.2", default-features = false }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[dev-dependencies]
conformance-backend = { path = "../../conformance/backend" }
polars-core = { version = "=0.55.2", default-features = false, features = ["dtype-categorical", "dtype-struct"] }

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "forbid", check-cfg = ["cfg(thinkthen_internal_doctest)"] }
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
