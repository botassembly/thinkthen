[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "thinkthen"
version = "0.0.1"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
# 1.44.2 is the tested pin, and it exports the Series Arrow stream the door reads.
polars = ["polars>=1.44.2,<2"]

[tool.maturin]
module-name = "thinkthen._thinkthen"
python-source = "."
features = ["extension-module"]
