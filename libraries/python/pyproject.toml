[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "thinkthen"
version = "0.0.1"
license = { text = "MIT" }
requires-python = ">=3.10"

# A convenience, never a code path: the wheel reaches Polars columns
# through the Arrow stream form and never imports Polars itself.
[project.optional-dependencies]
polars = ["polars"]

[tool.maturin]
module-name = "thinkthen._thinkthen"
python-source = "."
