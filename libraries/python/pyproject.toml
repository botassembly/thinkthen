[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "thinkthen"
version = "0.2.0"
description = "Semantic judgments over text for Python, through the thinkthen engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ian Maurer" }]
requires-python = ">=3.10"
keywords = ["classification", "llm", "text", "judgment"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://thinkthen.dev"
Repository = "https://github.com/botassembly/thinkthen"
Issues = "https://github.com/botassembly/thinkthen/issues"

[project.optional-dependencies]
# 1.44.2 is the tested optional Series adapter pin.
polars = ["polars>=1.44.2,<2"]
pydantic = ["pydantic>=2.11,<3"]

[tool.maturin]
module-name = "thinkthen._thinkthen"
python-source = "."
features = ["extension-module"]

[tool.maturin.sbom]
rust = false
