[package]
name = "thinkthen-python"
version = "0.0.1"
license = "MIT"
edition = "2021"
rust-version = "1.93.1"
publish = false

[lib]
name = "_thinkthen"
crate-type = ["cdylib"]

[dependencies]
thinkthen-contract = { path = "../../contract" }
thinkthen-standin = { path = "../../standin" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1"

# A library artifact unwinds: an abort would kill the host's process.
[profile.release]
panic = "unwind"

# `extension-module` is off by default so the unit tests link libpython
# and can construct the host exception of each error kind; the wheel build
# enables it through `[tool.maturin] features` in pyproject.toml.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# The stand-in's compile-time partial-failure fixture (finding 7): the
# gate builds with it, a shipped wheel never does, and no environment
# variable can arm it (standin/src/lib.rs).
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

# A surface builds on its own, outside the crates workspace, so its
# binding's profile and toolchain never leak into the command.
[workspace]

# The strict lint rules, matching the house set every standalone workspace
# carries: this surface's FFI keeps unsafe (pyo3 owns it), so the rules
# here are the Rust ones it can hold, plus the three clippy denies every
# workspace shares.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "forbid"
# `unreachable_pub` cannot apply here yet: src/generated.rs registers the
# module with a `pub fn` the generator emits; restricting it is a change
# to scripts/generate_functions.py, recorded for the follow-up wave.

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
