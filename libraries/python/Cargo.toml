# The Python surface (ticket 0105, ADR 0047). It is its own workspace with its
# own lock, and it reaches `thinkthen` only through the public API.
# `sdlc/scripts/policy.py` holds the lint tables and the release profile to the
# root copies.
[workspace]

[package]
name = "thinkthen-python"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "The Python binding of thinkthen: import thinkthen as tt"
license = "MIT"
publish = false

[lib]
name = "_thinkthen"
crate-type = ["cdylib"]

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false, features = ["bundled-sqlite"] }
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

# `extension-module` stays on for the wheel. The Rust unit tests turn it off
# with --no-default-features, so they link libpython and can raise the host's
# exceptions. `probe` builds the test hooks `_live_workers`; check.sh builds
# the tested extension with it, and build-wheel.sh never does.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
probe = []

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
