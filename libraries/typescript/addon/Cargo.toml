[package]
name = "thinkthen-typescript-addon"
version = "0.0.1"
edition = "2021"
description = "The Node-API door over the thinkthen contract, run by the stand-in engine. Not published."
publish = false

[lib]
crate-type = ["cdylib"]

# Standalone workspace: the surface builds through its own lock, beside the
# repository workspace, so nine surfaces never race one members array.
[workspace]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde_json = "1"
thinkthen-contract = { path = "../../../contract" }
thinkthen-standin = { path = "../../../standin" }

# The stand-in's one synthesized partial failure (conformance case 74),
# armed at compile time. The gate builds with it (`npm run build:synthetic`)
# so the marker case runs; `npm run build`, the packaging path, never
# carries the fixture.
[features]
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

[profile.release]
lto = true
