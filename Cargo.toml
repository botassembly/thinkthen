[workspace]
members = ["crates/thinkthen", "conformance/backend"]
# Ticket 0086: the external consumer is its own workspace, built by the test rung.
exclude = ["conformance/consumer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[profile.release]
# A library must unwind through a host. The command's release build selects
# abort through its dedicated build path.
overflow-checks = true
panic = "unwind"

[workspace.lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "forbid", check-cfg = ["cfg(thinkthen_internal_doctest)"] }
unreachable_pub = "forbid"
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
