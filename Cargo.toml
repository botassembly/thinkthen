[workspace]
members = ["crates/thinkthen", "conformance/backend"]
# Ticket 0086: the external consumer is its own workspace, built by the test rung.
# ADR 0047: each binding under `libraries` or `databases` is its own workspace
# too, and a plain `cargo build` here compiles `thinkthen` alone.
exclude = ["conformance/consumer", "libraries", "databases"]
default-members = ["crates/thinkthen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
# A library must unwind through a host. The command's release build selects
# abort through its dedicated build path.
overflow-checks = true
panic = "unwind"

# Ticket 0338: an unoptimized serde_json and sha2 spent 29 of 30 s planning a
# 255-line relation in a test build; optimized, the plan takes 1 s. Only these
# two dependencies change, so a change to thinkthen rebuilds no faster or slower.
[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[workspace.lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
