# The DuckDB surface (tickets 0110 and 0118, ADR 0047). It is its own
# workspace with its own lock, and it reaches `thinkthen` only through the
# public API. `sdlc/scripts/policy.py` holds every table below to the root
# copies. The C API comes from `libduckdb-sys` alone: every call goes through
# the raw C API, so the `duckdb` wrapper crate and its arrow tree stay out.
[workspace]

[package]
name = "thinkthen-duckdb"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "The DuckDB extension: SQL functions over the thinkthen engine"
license = "MIT"
publish = false

[lib]
name = "thinkthen_duckdb"
crate-type = ["cdylib"]

[features]
default = []
# Every test-only door: the R7-7 raise in the SIGINT install window and the
# R1-10 panic trigger. `check.sh` refuses a shipped build that carries any.
test-hooks = []

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false }
libduckdb-sys = { version = "=1.10505.0", default-features = false, features = ["loadable-extension"] }
libc = "0.2.189"
serde_json = "1.0.151"

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "forbid", check-cfg = ["cfg(thinkthen_internal_doctest)"] }
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
