# Retired C API workspace metadata. The shipped extension is cpp/ with the
# bridge/ static library; this unpublished crate exports no DuckDB entry.
# The independent binding policy still checks this manifest and its lock.
[workspace]

[package]
name = "thinkthen-duckdb"
version = "0.1.2"
edition = "2024"
rust-version = "1.95.0"
description = "The DuckDB extension: SQL functions over the thinkthen engine"
license = "MIT"
publish = false

[lib]
name = "thinkthen_duckdb_retired"
crate-type = ["rlib"]

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false, features = ["bundled-sqlite"] }

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
