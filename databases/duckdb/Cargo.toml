[package]
name = "thinkthen"
version = "0.0.1"
edition = "2024"
description = "The DuckDB surface: nine SQL functions over the one engine, per ADR 0017. Version 0.1.0 is the first release"
license = "MIT"
publish = false

# A workspace of its own, so the root workspace's gates and profile stay
# untouched.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
# A library lives inside someone else's process, and an abort there kills
# the host. The command's own profile stays as the root workspace sets it.
panic = "unwind"

[features]
# The stand-in's compile-time fixture opt-in, forwarded so the failed-marker
# conformance case can run against a fixture-armed build (check.sh builds
# one beside the default extension); a shipped build never carries it.
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar", "vscalar-arrow"] }
libc = "0.2"
serde_json = "1"
thinkthen-contract = { path = "../../contract" }
# The one dependency that changes when the real engine lands.
thinkthen-standin = { path = "../../standin" }
