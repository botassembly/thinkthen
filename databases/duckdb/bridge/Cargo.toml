[workspace]

[package]
name = "thinkthen-duckdb-bridge"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
thinkthen = { path = "../../../crates/thinkthen", default-features = false }

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = "forbid"
unreachable_pub = "forbid"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
