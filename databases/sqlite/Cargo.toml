# The SQLite surface (ticket 0109, ADR 0047). It is its own workspace with
# its own lock, and it reaches `thinkthen` only through the public API.
# `sdlc/scripts/policy.py` holds every table below to the root copies.
[workspace]

[package]
name = "thinkthen-sqlite"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "The SQLite extension: thinkthen's judgments as SQL functions"
license = "MIT"
publish = false

[lib]
# SQLite derives the entry point from the file's basename and strips a
# trailing digit group, so `libthinkthen0.so` enters at
# `sqlite3_thinkthen_init`. The slide's `.load ./thinkthen` loads a copy.
name = "thinkthen0"
crate-type = ["cdylib"]

[dependencies]
thinkthen = { path = "../../crates/thinkthen", default-features = false }
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["loadable_extension", "functions", "vtab"] }
serde = "=1.0.229"
serde_json = "=1.0.151"

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
missing_debug_implementations = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "forbid", check-cfg = ["cfg(thinkthen_internal_doctest)"] }
unreachable_pub = "forbid"
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"
dbg_macro = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
excessive_nesting = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
