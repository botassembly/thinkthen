[package]
name = "thinkthen"
version = "0.0.1"
edition = "2021"
rust-version = "1.93.1"
description = "The PostgreSQL surface: nine SQL functions over the one engine. Version 0.1.0 is the first release"
license = "MIT"
publish = false

# A workspace of its own, so the root workspace's gates and profile stay
# untouched and pgrx's cargo metadata step reads this folder alone.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_thinkthen"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg16"]
pg16 = ["pgrx/pg16"]
# Forward the stand-in's compile-time fixture door to a gate build that
# needs it (conformance case 74's synthesized partial failure). Off by
# default: a packaged extension carries no fixture code and no environment
# variable can arm one.
synthetic-partial = ["thinkthen-standin/synthetic-partial"]

[dependencies]
pgrx = "=0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thinkthen-contract = { path = "../../contract" }
# The one dependency that changes when the real engine lands.
thinkthen-standin = { path = "../../standin" }

[profile.release]
# A library artifact loads into someone else's process, and an abort there
# kills the whole backend (experiment 205, finding R4/C1).
panic = "unwind"

# The strict lint rules, matching the house set every standalone workspace
# carries: pgrx owns the unsafe here, so the rules are the Rust ones this
# crate can hold, plus the three clippy denies every workspace shares.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
