[package]
name = "stub-backend"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
serde_json = "1"

[workspace]

# The same strict rules the surfaces carry: the stub is product-shaped code
# the gate builds and runs, not scaffolding exempt from the rules.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
