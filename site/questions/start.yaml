- id: env-settings
  question: How do I set ThinkThen options with environment variables?
  source: product
  frequency: every THINKTHEN_* variable in the help; scripts and CI jobs need it
  rank: 30
  page: /reference/environment/
  reference: /reference/options/
  answers_page: true
  page_title: Environment variables
  reference_title: Command options
  reader: A developer configuring thinkthen in a script or CI job
  answer: |
    Set the `THINKTHEN_*` variable that matches the option, such as `THINKTHEN_FIELD=/text` for `--field /text` or `THINKTHEN_JSON=true` for `--json`, and ThinkThen {version} reads it for every command in that shell. A flag given on the command line wins over its variable.
  why: |
    Each option's help line names its variable in brackets, such as `--backend <backend> Backend name [THINKTHEN_BACKEND; default: systemone]`. ThinkThen reads the variable when the flag is absent. Switch options such as `--json` take `true` or `false` in their variable.
  limits: |
    Backend keys are not options: `THINKTHEN_API_KEY` and `OPENAI_API_KEY` are read by their backend only. List options such as `--choice` take a JSON array in their variable, such as `THINKTHEN_CHOICES='["billing","shipping"]'`. `--url` has no variable; the systemone backend reads `THINKTHEN_BASE_URL` instead.
  examples:
    - id: ans-env-settings
      says: "Set the field pointer and JSON output once, then run a command without `--field`:"
  explain:
    id: The record's id, from JSON Lines read with the `/text` pointer that `THINKTHEN_FIELD` set.
    answer: The answer, in the JSON row that `THINKTHEN_JSON` turned on.
- id: shell-variable
  question: How do I store a ThinkThen answer in a shell variable?
  source: cases
  frequency: every shell script that branches on an answer needs it
  rank: 60
  page: /articles/shell-branches-on-meaning/
  reference: /reference/commands/decide/
  answers_page: true
  page_title: Let your shell branch on meaning
  reference_title: thinkthen decide
  reader: A shell scripter who wants the answer as a value, not an exit code
  answer: |
    Capture the command's text output with `$(...)` and check its exit status before using the value. A successful decide call prints `true`, `false` or `unsure`; a produced failed result prints failure text and exits 6.
  why: |
    Text output is the default. Without `--quiet`, decide prints the result on standard output and diagnostics on standard error. Command substitution captures the result text, including a failure's code and reason when a result failed.
  limits: |
    A produced failed result prints `failed:` with its actual code and reason on standard output, reports its diagnostic on standard error, and exits 6, including a service outage. A call-level service refusal before any result can exit 4 with no result output. Check the substitution's exit status before branching; failure text is not `false` or `unsure`. Empty or blank input exits 2 before any request. For a plain yes-or-no branch, `--check` and the exit code are shorter. The model judges each message on its own, so handle `false` and `unsure` too.
  examples:
    - id: ans-shell-variable
      says: "Capture the answer in `$answer` and branch on it:"
  explain:
    "answer is:": "The captured text: the answer and nothing else."
    refunds queue: The branch taken because the answer was `true`.
- id: stdin-and-file
  question: How do I read standard input and a file in one ThinkThen command?
  source: product
  frequency: FILE arguments accept `-` for standard input
  rank: 64
  page: /your-data/
  reference: /reference/options/
  answers_page: true
  page_title: Your data
  reference_title: Command options
  reader: A shell user combining saved records with records from a pipe
  answer: |
    Name the file and `-` as arguments. ThinkThen {version} reads them in the order given, and `-` stands for standard input, so one command judges the saved records and the piped ones.
  why: |
    Every function takes several FILE arguments and reads them in order. `position` counts records across all of them, so the rows of `saved.txt` come first and the piped record follows.
  limits: |
    `-` may appear once. Every input uses the same framing, here `--from lines`. The model judges each line on its own words, whichever input it came from.
  examples:
    - id: ans-stdin-and-file
      says: "Judge the two lines of `saved.txt` and one piped line in one command:"
  explain:
    position: "The record's place across both inputs: `saved.txt` first, then the piped line."
    answer: Yes or no for each line.
