- id: name-question
  question: How do I label a ThinkThen question so I can find it in logs?
  source: product
  frequency: --name in every function's help
  rank: 54
  page: /answers/name-question/
  reference: /reference/options/
  answers_page: true
  page_title: Result rows
  reference_title: Command options
  reader: A developer who logs ThinkThen rows and needs to tell questions apart
  answer: |
    Add `--name` with a short label. ThinkThen {version} puts it in every row's `source.name`, beside the backend and the model, so a log line shows which question produced it.
  why: |
    Every row carries a `source` object that says where its answer came from. `--name` adds your label to it, so rows from several questions in one log stay apart. The name also becomes part of `source.question_identity`, the fingerprint of the question and its settings, so the same question under two names gets two identities.
  limits: |
    A name must hold visible text; `--name ''` stops with [`usage.name`](/reference/errors/usage-name/). `backend` and `model` name the backend and the model that answered, such as `systemone` and `jev-1.13.0`.
  examples:
    - id: ans-name
      says: "Ask one question under the name `refund-check`. `jq` keeps the answer and three fields of the row's `source`:"
  explain:
    answer: "The answer: `true` means yes."
    name: Your label, copied from `--name` onto every row.
    backend: The backend that answered.
    model: The model that answered.
