- id: two-fields
  question: How do I ask about two fields of a JSON record together?
  source: product
  frequency: --field selects one value; multi-field records are common
  rank: 31
  page: /your-data/
  reference: /reference/options/
  answers_page: true
  page_title: Your data
  reference_title: Command options
  reader: A developer whose field is split across fields such as subject and body
  answer: |
    Build one object that holds the fields, then point `--field` at it. Here `jq` turns `subject` and `body` into a `message` object, and ThinkThen {version} judges that object with `--field /message` while the row keeps the record's `id`.
  why: |
    `--field` takes one JSON Pointer, and a pointer selects one value. That value can be an object, so putting both fields under one key sends them to the model together. The top-level `id` stays outside the field and comes back on the row.
  limits: |
    A spreadsheet does this with a repeated `--column`, which sends an object keyed by column name. Every field you add makes the request larger, and one record's question must fit the backend's request limit. The model reads the subject and the body as one message and judges the whole request.
  examples:
    - id: ans-two-fields
      says: "The first `jq -c` builds a `message` object from `subject` and `body` for each record. ThinkThen judges that object, and the last `jq` keeps three fields of each row:"
  explain:
    id: The record's own `id`, kept outside the field.
    answer: Yes or no for the question.
    probability: The probability of yes, from 0 to 1. The default cut is 0.5.
- id: tsv
  question: How do I run ThinkThen on a TSV file?
  source: product
  frequency: tsv is one of six --from values
  rank: 36
  page: /your-data/
  reference: /reference/options/
  answers_page: true
  page_title: Your data
  reference_title: Command options
  reader: A developer or analyst with tab-separated data
  answer: |
    Treat it like a CSV file: name the field column with `--column` and the new answer column with `--into`. A `.tsv` file selects the framing; on standard input, add `--from tsv`. ThinkThen {version} writes the table back as TSV with the answer column added.
  why: |
    TSV is one of three table framings, with CSV and xlsx. Each line after the header is a record. ThinkThen keeps every input row in order and adds one answer column. `--details` would also add its status, probability, error, detail and source columns; without it, the table here has three columns, so `cut` shows them all.
  limits: |
    Table input takes no `--json`. An `--into` name that already exists in the header stops the command. Given a file argument instead of standard input, ThinkThen writes `NAME.thinkthen.tsv` beside it.
  examples:
    - id: ans-tsv
      says: "Judge the `text` column of a TSV file read from standard input. `cut -f 1-5` keeps up to five columns; the result has three, `id`, `text` and `refund`:"
  explain:
    refund: "The answer column that `--into` named: `TRUE` or `FALSE`."
- id: in-place
  question: How do I update a spreadsheet in place with ThinkThen?
  source: product
  frequency: --in-place in every function's help
  rank: 37
  page: /your-data/
  reference: /reference/options/
  answers_page: true
  page_title: Your data
  reference_title: Command options
  reader: A developer or analyst who wants answer columns added to the original file
  answer: |
    Add `--in-place`. ThinkThen {version} adds the answer column to the source file and keeps the original beside it as `NAME.backup.csv`. It prints the file's name, and names the backup on standard error.
  why: |
    Without `--in-place` or `--output`, a file input produces a new file beside it, `NAME.thinkthen.csv`. `--in-place` replaces the source instead, after it saves the backup, so the original data is never lost. Each question adds one answer column; `--details` also adds its status, probability, error, detail and source columns, such as `refund_status`.
  limits: |
    A second run with the same `--into` stops with a usage error, because that column now exists; pick a new name. A failure that stops the call, or an interrupt, leaves the source unchanged. Every run costs requests, so keep the backup until you have checked the answers.
  examples:
    - id: ans-in-place
      says: "Add the `refund` answer column to `messages.csv` in place:"
    - id: ans-in-place-ls
      says: "List the folder afterwards. `messages.backup.csv` holds the original file:"
    - id: ans-in-place-file
      says: "Show the updated `messages.csv`. Its header is now `id,text,refund`; without `--details`, no status column is added:"
  explain:
    "thinkthen: backup:": The name of the backup of the original file, printed on standard error.
    refund: The new answer column, now in the source file.
- id: many-files
  question: How do I run ThinkThen over several files at once?
  source: product
  frequency: every function takes FILE... in its help
  rank: 38
  page: /your-data/
  reference: /reference/commands/decide/
  answers_page: true
  page_title: Your data
  reference_title: thinkthen decide
  reader: A developer with records split across files
  answer: |
    Pass every file after the question. ThinkThen {version} reads them in order as one stream, so `position` keeps counting across files and one command batches all the records.
  why: |
    Each function takes `[FILE]...`. The files' records join one input stream, in the order given, so positions run 1, 2, 3 and then 4 for the second file's first record. Use `-` among the files to include standard input.
  limits: |
    All files use one framing; a `.jsonl` extension or `--from` sets it. When a row fails, the command names the input file and position on standard error. Records from all the files share requests, up to `--batch` records in each.
  examples:
    - id: ans-many-files
      says: "Judge two JSON Lines files in one command. `jq` keeps three fields of each row:"
  explain:
    position: The record's place in the combined input, counting across files.
    id: The record's own `id`; `b1` is the first record of `more.jsonl`.
    answer: Yes or no for the question.
