- id: not-sure-queue
  question: How do I send the answers ThinkThen is not sure about to a person?
  source: cases
  frequency: every triage case routes the band's middle to a person
  rank: 19
  page: /break-a-problem-into-decisions/
  reference: /reference/rows/
  answers_page: true
  page_title: Break a problem into decisions
  reference_title: Result rows
  reader: A developer who wants a person to review the cases the model is not sure about
  answer: |
    Use decide with `--low` and `--high`, write JSON Lines with `--json`, and send results whose `status` is `unsure` to a person. Handle `failed` results separately; read a boolean answer only when the status is `answered`. Filter takes one bar, and choose returns a label using its single `--threshold`.
  why: |
    For decide, a probability between the bars produces `"status":"unsure"`, its probability, and no answer. Below `--low` the answer is `false`; at or above `--high` it is `true`. Failed results carry their error instead of an answer. `jq` keeps the ids of the not-sure results.
  limits: |
    Choose, tag, find, recognize and relate use a single bar; choose answers with a label rather than a boolean. In a spreadsheet, a not sure row's answer cell is empty, or `#N/A` in xlsx; add `--details` for a `_status` column that reads `unsure`, and filter that column instead of using `jq`. How many results fall between the bars depends on the model and where you set `--low` and `--high`. A band does not make a model calibrated: check where its answers fall on your own labeled sample.
  examples:
    - id: ans-notsure-queue
      says: "Ask with a band from 0.2 to 0.8 and print the id of each not sure row:"
  explain:
    a3: The id of the one record whose probability fell inside the band.
- id: count-yes
  question: How do I count how many records answer yes?
  source: cases
  frequency: survey and screening cases report counts
  rank: 26
  page: /functions/filter/
  reference: /reference/rows/
  answers_page: true
  page_title: "filter: keep the records that answer yes"
  reference_title: Result rows
  reader: A developer or analyst who needs a count of yes answers
  answer: |
    Run decide with `--json` so every record gets a row, then count the rows whose `answer` is `true`. One ThinkThen {version} command and one `jq` call give the total and the yes count.
  why: |
    `--json` writes one row per record, including the no, not sure and failed ones, so the total is the number of rows. `jq -s` reads every row into one array, and `select(.answer == true)` keeps the yes rows.
  limits: |
    Filter prints only the kept input, so `wc -l` counts kept messages; a failed message still makes the command exit 6 and produces a diagnostic. Count `status` values too when some rows may have failed or been not sure. The yes count is the model's judgment of each record; check it on a sample before you report it.
  examples:
    - id: ans-count-yes
      says: "Judge three messages and count the rows and the yes answers:"
  explain:
    records: The number of rows, one per record.
    yes: The number of rows whose answer is `true`.
- id: classify-log
  question: How do I classify every line of a log file?
  source: cases
  frequency: the group-alerts-into-incidents case
  rank: 27
  page: /how-tos/sort-alerts-by-kind/
  reference: /reference/commands/choose/
  answers_page: true
  page_title: Sort alerts by kind
  reference_title: thinkthen choose
  reader: An operator who wants each log line labeled by system
  answer: |
    Run `thinkthen choose` with `--from lines` on the log file, one `--choice` per category, and `--json`. ThinkThen {version} judges each line as its own record and returns one choice per line, numbered by `position`.
  why: |
    `--from lines` makes each nonblank line a record. Choose returns exactly one of the choices for each, and `position` ties each answer to its line. An `other` choice catches lines that fit no category.
  limits: |
    Choose picks one category per line; use tag when a line can belong to several. A very long line still has to fit the backend's request limit. The model reads each line's words, so a line that fits no category goes to `other` only when you offer it.
  examples:
    - id: ans-log-lines
      says: "Sort each line of `app.log` into one of four categories. `jq` keeps the line number and the answer:"
  explain:
    position: The line's number in the log.
    answer: The category chosen for that line.
- id: choice-probabilities
  question: How do I see the probability of every choice or label in ThinkThen?
  source: product
  frequency: choose and tag rows carry a detail field
  rank: 70
  page: /functions/choose/
  reference: /reference/rows/
  answers_page: true
  page_title: "choose: pick one answer from a list"
  reference_title: Result rows
  reader: A developer who wants the runner-up choice, not only the winner
  answer: |
    Add `--json` and read the row's `detail.labels`. For choose and tag, ThinkThen {version} puts one probability per choice or label there, beside the answer.
  why: |
    `probability` belongs to the winning choice, and a tag row has one answer list. `detail.labels` keeps every probability, so you can see how close the runner-up came or set your own cut per label.
  limits: |
    Score and rank keep their numbers in `detail` too, under their own fields; [Result rows](/reference/rows/) lists each. The runner-up's probability shows how close the call was.
  examples:
    - id: ans-choice-probabilities
      says: "Choose a topic for one message and keep every choice's probability:"
    - id: ans-tag-probabilities
      says: "Tag a message with two labels and keep each label's probability:"
  explain:
    answer: The winning choice, or the list of labels at or above the cut.
    probability: The winning choice's probability.
    choices: Every choice with its probability, from `detail.labels`.
    labels: Every label with its probability, from `detail.labels`.
