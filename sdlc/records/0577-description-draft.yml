# Draft for approval. Replace both ref placeholders with the reviewed 0.2 candidate.
extension:
  name: thinkthen
  description: Ask questions about text in SQL and return answers, labels or scores.
  version: '0.2.0'
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - imaurer
  requires_toolchains: rust
  excluded_platforms: "windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads"

repo:
  github: botassembly/thinkthen
  ref: '<reviewed-0.2-candidate-commit>'
  ref_next: '<reviewed-0.2-candidate-commit>'

docs:
  hello_world: |
    -- Preview one request without a key or a model call.
    SELECT (thinkthen_plan('Does the writer ask for a refund?', '{"7":"Please refund my order."}', '{}')).records;
  extended_description: |
    ThinkThen is ten functions on top of Jev, TypeSafe's System One model, or any model like it. System One models return probabilities. Your code decides what to do with them. ThinkThen makes these models simple to call from any language or database. Use Jev, OpenAI or a local model. Ask a typed question and get back `true`, `false`, a label or a number. Your code branches on the answer. A model can say not sure, and a failed call never looks like an answer. ThinkThen packs many records into few requests, saves each answer for reuse, and lets tests replay saved answers with no key and no network.

    The extension is free and MIT licensed. Hosted models charge per token. Local models are free to use; you supply the computer that runs them.

    A live judgment sends the question and text to the selected backend. The default is TypeSafe. Set `THINKTHEN_API_KEY` before starting DuckDB for a hosted call.

    This submission targets DuckDB 1.5.6 and 2.0. See https://thinkthen.dev/databases/duckdb/ for installation and SQL examples.
