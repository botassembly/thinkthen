[package]
name = "thinkthen-core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Pure decision types and rendering for thinkthen"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
