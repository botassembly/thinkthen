[package]
publish = false
name = "thinkthen-ffi"
description = "A counted C interface to shared ThinkThen calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "thinkthen_ffi"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
fixture-routing = []

[dependencies]
log.workspace = true
thinkthen = { workspace=true, features=["native"] }
thinkthen-sql = { path = "../thinkthen-sql" }
serde_json.workspace = true

[dev-dependencies]
socket2.workspace = true
serde.workspace = true
cbindgen = { version="0.29", default-features=false }
loopback.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "forbid"
unreachable_pub = "forbid"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[[test]]
name = "transport_logging"
path = "../thinkthen/tests/cli_transport_logging.rs"
