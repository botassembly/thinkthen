[package]
name = "thinkthen-host"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["thinkthen/bundled-sqlite"]
host-sqlite = ["thinkthen/host-sqlite"]

[dependencies]
thinkthen = { path = "../thinkthen", default-features = false }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[lints]
workspace = true
