[package]
name = "thinkthen"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Semantic commands for the shell: if, grep, and sort that understand meaning"
license = "MIT"
repository = "https://github.com/botassembly/thinkthen"
readme = "../../README.md"
keywords = ["classification", "llm", "cli", "text"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[[bin]]
name = "thinkthen"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:csv-core", "dep:signal-hook"]

[dependencies]
arc-swap = "=1.7.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
csv-core = { version = "0.1.13", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
signal-hook = { version = "0.3.18", optional = true }
thiserror = "2.0.20"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
conformance-backend = { path = "../../conformance/backend" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
signal-hook = "0.3.18"

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["pthread", "signal"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
