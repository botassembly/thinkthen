[package]
name = "thinkthen"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Put a decider model in the shell"
publish = false

[[bin]]
name = "thinkthen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thinkthen-core = { path = "../thinkthen-core" }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
