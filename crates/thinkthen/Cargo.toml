[package]
name = "thinkthen"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Put a decider model in the shell"
license = "MIT"
publish = false

[[bin]]
name = "thinkthen"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:csv-core"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
csv-core = { version = "0.1.13", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
signal-hook = "0.3.18"
thiserror = "2.0.20"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
