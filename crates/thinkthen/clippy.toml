# Keep functions and types reviewable. These thresholds bite because the
# matching lints are enabled in the workspace Cargo.toml and every warning
# fails the gate.
too-many-lines-threshold = 90
too-many-arguments-threshold = 6
type-complexity-threshold = 180
cognitive-complexity-threshold = 20
excessive-nesting-threshold = 4
enum-variant-size-threshold = 200

# Assertion ergonomics are allowed in tests. Diagnostics and stray printing are not.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false
allow-print-in-tests = false

# The core module is pure. It reaches no file, no environment variable, no
# socket, no clock, and no process. Only its module attributes enable these
# otherwise dormant ban lists.
