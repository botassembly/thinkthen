# The binary owns every edge, so it carries no input-output ban list. It keeps
# the same complexity ceilings and the same test allowances as the core.
too-many-lines-threshold = 90
too-many-arguments-threshold = 6
type-complexity-threshold = 180
cognitive-complexity-threshold = 20
excessive-nesting-threshold = 4
enum-variant-size-threshold = 200

# Assertion ergonomics are allowed in tests. Diagnostics and stray printing are not.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false
allow-print-in-tests = false
